title: Percona UBI-9 Container Custom Images for PostgreSQL %!{PG_MAJOR_VERSION}
description: |
  This project contains UBI-9 based container custom images for Percona Software for PostgreSQL %!{PG_MAJOR_VERSION}.

# This project's repository set and build configuration are unrelated to its
# parent's: declare them in full here instead of patching the inherited ones.
repositories-inherit: false
project-config-inherit: false

repositories:
  - name: ubi9
    paths:
      - project: RedHat:UBI:Registry
        repository: images
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}:extras
        repository: UBI_9
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: UBI_9
      - subproject: ppg:staging:%!{PG_PREV_MAJOR_VERSION}
        repository: UBI_9
      - subproject: ppg:common:deps
        repository: UBI_9
      - subproject: common:containers:ubi9
        repository: UBI_9
      - project: Fedora:EPEL:9
        repository: standard
      - project: RedHat:UBI-9
        repository: standard
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "ubi9"
  Type: docker
  BuildEngine: podman
  # The retired kiwi base project set these for every image; the image
  # projects carry them themselves now that the base comes from the registry.
  BuildFlags: container-compression-format:zstd
  BuildFlags: container-build-format:oci
  BuildFlags: dockerarg:PPG_REPO=staging
  BuildFlags: dockerarg:RHEL_VER=el9
  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi9/ubi-minimal:latest

  Preinstall: skopeo

  ExpandFlags: filterbasecontainerpkgs
  Prefer: redhat-release
  Prefer: glibc-minimal-langpack
  Prefer: gpgme
  Prefer: iptables-nft
  Prefer: percona-postgresql%!{PG_MAJOR_VERSION}-libs
  Ignore: rocky-release

  Prefer: glibc-minimal-langpack

  BuildFlags: sbom:spdx
  BuildFlags: sbom:cyclonedx
  PublishFlags: withsbom
  %endif

# QA: the custom (extras) image (docker-server-parallel-custom appends
# percona-distribution-postgresql-custom).
qa:
  - name: custom
    pipeline: docker-server-parallel-custom
    parameters:
      DOCKER_TAG: "%!{PG_MAJOR_VERSION}"
      SERVER_VERSION: "%!{PG_VERSION}"
      TESTING_BRANCH: main
      REPOSITORY: ${OBS_CONTAINER_REGISTRY}/${OBS_CONTAINER_REGISTRY_ROOTPRJ}/ppg/staging/18/extras/containers/ubi9
