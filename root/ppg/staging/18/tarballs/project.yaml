title: Percona PostgreSQL %!{PG_MAJOR_VERSION} Tarballs
description: |
  Binary tarball (simpleimage) builds for Percona Software for PostgreSQL
  %!{PG_MAJOR_VERSION}. Each repository is one SSL variant of the official
  tarball, built against a different EL base of ppg:staging:%!{PG_MAJOR_VERSION}:
  ssl1.1 (RockyLinux 8), ssl3 (RockyLinux 9.6 — the RHEL 9.6 EUS vault
  baseline, OpenSSL 3.2), ssl3.5 (RockyLinux 9 — the rolling 9.8+ base,
  OpenSSL 3.5).

  The RockyLinux_8/RockyLinux_9.6/RockyLinux_9 repositories are plain RPM
  build repos (not simpleimage): they build percona-psql — psql linked
  against BSD libedit instead of the host's libreadline — which is built
  from each PG major's own source and therefore cannot live in the
  PG-version-agnostic ppg:common:deps:tarballs subproject where every
  other tarball-only dependency (percona-perl/tcl/python3, percona-gdal/
  proj, the EL8 krb5/libssh rebuilds, percona-gis-compat) now does. They
  are unpublished; the ssl variants consume them through the same-project
  sibling path below, and the shared deps through ppg:common:deps:tarballs.

repositories:
  - name: RockyLinux_8
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_8
      - subproject: ppg:common:deps:tarballs
        repository: RockyLinux_8
      - subproject: ppg:common:deps
        repository: RockyLinux_8
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:8
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: appstream
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: baseos
      # libedit-devel lives in PowerTools == RockyLinux:8/devel.
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: devel
    archs: [x86_64, aarch64]
  - name: RockyLinux_9.6
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_9.6
      - subproject: ppg:common:deps:tarballs
        repository: RockyLinux_9.6
      - subproject: ppg:common:deps
        repository: RockyLinux_9.6
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      # libedit-devel is in CRB, part of RockyLinux:9.6/standard (same
      # layout as RockyLinux:9 — watch the first build in case the 9.6
      # vault interconnect splits CRB out).
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9.6
        repository: standard
    archs: [x86_64, aarch64]
  # Helper-RPM repo for the ssl3.5 variant: same EL base (rolling Rocky 9)
  # as the tarball that bundles its percona-psql/percona-gis-compat.
  - name: RockyLinux_9
    paths:
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_9
      - subproject: ppg:common:deps:tarballs
        repository: RockyLinux_9
      - subproject: ppg:common:deps
        repository: RockyLinux_9
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      # libedit-devel is in CRB, part of RockyLinux:9/standard.
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9
        repository: standard
    archs: [x86_64, aarch64]
  - name: ssl1.1
    paths:
      # First path: this project's own RockyLinux_8 build repo, so the
      # simpleimage chroot can BuildRequire percona-psql built on the same base.
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}:tarballs
        repository: RockyLinux_8
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_8
      - subproject: ppg:common:deps:tarballs
        repository: RockyLinux_8
      - subproject: ppg:common:deps
        repository: RockyLinux_8
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:8
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: appstream
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: baseos
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:8
        repository: devel
    archs: [x86_64, aarch64]
  # ssl3 builds on the RockyLinux_9.6 base (RHEL 9.6 EUS vault, OpenSSL
  # 3.2). The original blocker (staging pgcrypto.so built on Rocky 9.8+
  # referenced OPENSSL_3.4.0 version nodes — RHEL 9.8 rebased to OpenSSL
  # 3.5.x — breaking the "ssl3 runs on any OpenSSL 3.0 host" promise)
  # disappears on this baseline: 3.2 headers predate the 3.4
  # EVP_MD_CTX_size()->EVP_MD_CTX_get_size_ex() remap, so pgcrypto needs no
  # source patch (the one we carried is dropped) and every bundled binary
  # stays at OPENSSL_3.0.* nodes — still enforced per artifact by
  # build-tarball.sh's section-15 host-ABI audit. An interim Ubuntu 22.04
  # deb-based ssl3 was abandoned: the PGDG deb layout is non-relocatable
  # (multiarch lib paths, /usr/share/postgresql split), unlike the PGDG RPM
  # /usr/pgsql-NN prefix the tarball layout is derived from.
  - name: ssl3
    paths:
      # See the ssl1.1 comment: own RockyLinux_9.6 build repo first.
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}:tarballs
        repository: RockyLinux_9.6
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_9.6
      - subproject: ppg:common:deps:tarballs
        repository: RockyLinux_9.6
      - subproject: ppg:common:deps
        repository: RockyLinux_9.6
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9.6
        repository: standard
    archs: [x86_64, aarch64]
  # ssl3.5 builds on the rolling RockyLinux_9 base (Rocky 9.8+, OpenSSL
  # 3.5): binaries may reference version nodes up to OPENSSL_3.5.x, so
  # this variant runs on hosts with OpenSSL >= 3.5 — where e.g. pgcrypto's
  # OPENSSL_3.4.0 need (gone from ssl3 with the 9.6 move) resolves fine.
  # build-tarball.sh derives the variant label from the chroot's
  # openssl-libs version and picks the section-15 gate policy from it.
  - name: ssl3.5
    paths:
      # See the ssl1.1 comment: own RockyLinux_9 build repo first.
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}:tarballs
        repository: RockyLinux_9
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: RockyLinux_9
      - subproject: ppg:common:deps:tarballs
        repository: RockyLinux_9
      - subproject: ppg:common:deps
        repository: RockyLinux_9
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9
        repository: standard
    archs: [x86_64, aarch64]

publish:
  # Helper-RPM build repos: consumed only through the sibling path above,
  # never shipped as a repository.
  RockyLinux_8: false
  RockyLinux_9.6: false
  RockyLinux_9: false
  ssl1.1: true
  ssl3: true
  ssl3.5: true

project-config: |
  # "Type:" is repo-scoped: only the ssl* repositories build simpleimage
  # recipes. The RockyLinux_* repos build ordinary RPM specs and must keep
  # obs-build's default recipe-type detection.
  %if "%_repository" == "ssl1.1"
  Type: simpleimage
  # Explicit binary format: "Type: simpleimage" above disables obs-build's
  # recipe-type guessing (which would have derived it from the Preinstall
  # list), and simpleimage is not one of the image types (kiwi, docker, ...)
  # for which Build.pm re-derives the binary format, so without this the
  # repo resolves with binarytype UNDEFINED. Harmless for RPM repos (the
  # expander falls back to RPM semantics) but declare it anyway.
  Binarytype: rpm
  # Same install-time resolution hints as staging RockyLinux_8.
  ExpandFlags: module:llvm-toolset-rhel8
  ExpandFlags: module:perl-5.26
  ExpandFlags: module:perl-IO-Socket-SSL-2.066
  ExpandFlags: module:perl-libwww-perl-6.34
  Prefer: python3-devel
  Prefer: selinux-policy-targeted
  # PostGIS's libgdal.so.NN()(64bit)/libproj.so.NN()(64bit) Requires are a
  # "have choice" between EPEL's gdal-libs/proj and our /opt-prefixed
  # percona-gdal/percona-proj (ppg:common:deps:tarballs deliberately keeps those
  # auto-Provides). Ours must win: EPEL's fully-optioned libgdal drags ~70
  # surplus shared objects into the tarball — including the armadillo/BLAS
  # chain whose FlexiBLAS ELF constructor abort()s on Rocky hosts — and has
  # its data directory compiled to /usr/share/{gdal,proj}, a path no tarball
  # host has. build-tarball.sh asserts EPEL's are absent from the chroot.
  Prefer: percona-gdal
  Prefer: percona-proj
  # ...but `Prefer:` only breaks TIES between providers of the SAME symbol.
  # PostGIS also requires the distro GDAL/PROJ *by name* (rpmspec -P on
  # root/ppg/staging/%!{PG_MAJOR_VERSION}/percona-postgis/rpm/percona-postgis.spec:
  # `Requires: gdal-libs >= 3.0.4`, `Requires: gdal-libs` and
  # `Requires: geos proj libgeotiff` on EL8; `gdal3.4-libs` on EL9 — all in
  # the main percona-postgis35_%!{PG_MAJOR_VERSION} package, no subpackage).
  # A by-name Requires has exactly one provider, so there is no choice for
  # Prefer to resolve.
  #
  # PROVEN 2026-08-26 (first OBS build of these repos): a package-scoped
  # `Ignore:` rule dropping those edges does NOT help — OBS does not apply
  # `Ignore:` rules when expanding image-type recipes. The effective prjconf
  # carried the lines, yet EPEL's gdal-libs/gdal3.4-libs and Rocky's proj
  # were still installed and build-tarball.sh section 0a FATALed as
  # designed. `Prefer:` IS honoured for image-type expansion (`Prefer:
  # hdf-libs`, and percona-gdal/percona-proj/percona-psql all landing in the
  # chroot). Those inert Ignore: lines are therefore gone.
  #
  # Instead, the payload-free percona-gis-compat shim (from the unpublished
  # ppg:common:deps:tarballs subproject) Provides those distro NAMES
  # itself, which turns each by-name Requires into a real have-choice that
  # the Prefer: below resolves; the shim Requires percona-gdal/percona-proj
  # so the runtimes PostGIS needs still come in. The simpleimage recipe also
  # BuildRequires it explicitly, so its presence does not hinge on the
  # choice alone.
  #
  # PostGIS's `Requires: hdf5` (also by name) is left alone: hdf5 is small,
  # nothing in the tarball bundles it, and the surplus gate is
  # artifact-based, not chroot-based.
  Prefer: percona-gis-compat
  # glibc requires the virtual "glibc-langpack"; every glibc-langpack-*
  # (plus glibc-all-langpacks and glibc-minimal-langpack) provides it, and
  # image-type expansion resolves the full runtime closure while ignoring
  # the base config's "Ignore: glibc:glibc-langpack" rule, so OBS reports
  # "have choice for glibc-langpack needed by glibc". Pick the minimal
  # langpack (same fix as the ubi9 container project config).
  Prefer: glibc-minimal-langpack
  %endif

  %if "%_repository" == "ssl3"
  Type: simpleimage
  # Explicit binary format (see the ssl1.1 comment).
  Binarytype: rpm
  # Same choice-resolution as staging RockyLinux_9.6: hdf-libs and hdf both
  # provide libdf.so.0. This is LIVE, not a leftover — percona-gdal is built
  # --without-hdf4/hdf5 so the gdal chain no longer drags hdf in, but PostGIS
  # itself carries `Requires: hdf5` by name, and hdf5 requires libdf.so.0.
  # Without this line the ssl3 chroot fails to resolve with "have choice for
  # libdf.so.0()(64bit) needed by hdf5". (hdf5 is small and is NOT worth an
  # Ignore: rule — nothing in the tarball bundles it, section 0a only guards
  # the GDAL/PROJ names.)
  Prefer: hdf-libs
  # 9.6-baseline choice resolution, mirrored from ppg:staging's prjconf
  # RockyLinux_9.6 block (the tarball buildconfig is THIS prjconf + base
  # distro only — staging's prjconf is never inherited): EPEL 9 tracks the
  # latest RHEL 9 minor, so on the 9.6 baseline EPEL's llvm19-libs compat
  # package and the distro llvm-libs (19.1.7) both provide libLLVM.so.19.1,
  # and lapack/lapack64 + blas/blas64 both provide liblapack.so.3 /
  # libblas.so.3 (pulled in by armadillo via PostGIS's EPEL gdal chain).
  Prefer: llvm-libs
  Prefer: lapack
  Prefer: blas
  # See the ssl1.1 block: our lean /opt GDAL+PROJ must win the
  # libgdal.so.NN()(64bit)/libproj.so.NN()(64bit) choice over EPEL's
  # gdal-libs/proj.
  Prefer: percona-gdal
  Prefer: percona-proj
  # ...but `Prefer:` only breaks TIES between providers of the SAME symbol.
  # PostGIS also requires the distro GDAL/PROJ *by name* (rpmspec -P on
  # root/ppg/staging/%!{PG_MAJOR_VERSION}/percona-postgis/rpm/percona-postgis.spec:
  # `Requires: gdal-libs >= 3.0.4`, `Requires: gdal-libs` and
  # `Requires: geos proj libgeotiff` on EL8; `gdal3.4-libs` on EL9 — all in
  # the main percona-postgis35_%!{PG_MAJOR_VERSION} package, no subpackage).
  # A by-name Requires has exactly one provider, so there is no choice for
  # Prefer to resolve.
  #
  # PROVEN 2026-08-26 (first OBS build of these repos): a package-scoped
  # `Ignore:` rule dropping those edges does NOT help — OBS does not apply
  # `Ignore:` rules when expanding image-type recipes. The effective prjconf
  # carried the lines, yet EPEL's gdal-libs/gdal3.4-libs and Rocky's proj
  # were still installed and build-tarball.sh section 0a FATALed as
  # designed. `Prefer:` IS honoured for image-type expansion (`Prefer:
  # hdf-libs`, and percona-gdal/percona-proj/percona-psql all landing in the
  # chroot). Those inert Ignore: lines are therefore gone.
  #
  # Instead, the payload-free percona-gis-compat shim (from the unpublished
  # ppg:common:deps:tarballs subproject) Provides those distro NAMES
  # itself, which turns each by-name Requires into a real have-choice that
  # the Prefer: below resolves; the shim Requires percona-gdal/percona-proj
  # so the runtimes PostGIS needs still come in. The simpleimage recipe also
  # BuildRequires it explicitly, so its presence does not hinge on the
  # choice alone.
  #
  # PostGIS's `Requires: hdf5` (also by name) is left alone: hdf5 is small,
  # nothing in the tarball bundles it, and the surplus gate is
  # artifact-based, not chroot-based.
  Prefer: percona-gis-compat
  # Same glibc-langpack choice as ssl1.1 above: the EL9 base configs carry
  # only "Ignore: glibc:glibc-langpack" (no Prefer), which image-type
  # expansion ignores.
  Prefer: glibc-minimal-langpack
  %endif

  %if "%_repository" == "ssl3.5"
  Type: simpleimage
  # Explicit binary format (see the ssl1.1 comment).
  Binarytype: rpm
  # EL9 choice-resolution, same as the ssl3 block above (see it for the
  # full rationale on every line): hdf-libs vs hdf for libdf.so.0; the
  # lean /opt percona-gdal/percona-proj must win the SONAME choices over
  # EPEL's gdal-libs/proj; the payload-free percona-gis-compat shim turns
  # PostGIS's by-name distro GDAL/PROJ Requires into resolvable choices
  # (prjconf Ignore: is NOT applied to image-type expansion — proven
  # 2026-08-26); and the EL9 base config's glibc-langpack Ignore is
  # likewise skipped, so pick the minimal langpack.
  #
  # Deliberately ABSENT: the ssl3 block's Prefer llvm-libs/lapack/blas —
  # those settle 9.6-vault-vs-EPEL version skew; the rolling 9.8 base
  # built the pre-9.6 ssl3 without them. Add back with evidence if the
  # first build reports a have-choice.
  Prefer: hdf-libs
  Prefer: percona-gdal
  Prefer: percona-proj
  Prefer: percona-gis-compat
  Prefer: glibc-minimal-langpack
  %endif
