description: |
  GDAL/PROJ name-compatibility shim for the binary tarball build chroots.
  Provides the distro package names percona-postgis35_%!{PG_MAJOR_VERSION}
  requires by name (gdal-libs/proj on EL8, gdal3.4-libs/proj on EL9) so the
  OBS expander has a choice that `Prefer: percona-gis-compat` can resolve
  towards the lean /opt-prefixed percona-gdal/percona-proj runtimes. Payload
  free; never published outside this project.

build:
  # Plain RPM package: it is a build input for the simpleimage recipes, so it
  # must not build on the ssl* (Type: simpleimage) repositories. Keeping it on
  # the unpublished RockyLinux_8/RockyLinux_9 repos only is also what keeps
  # its fake Provides: invisible to every other project.
  ssl1.1: false
  ssl3: false
