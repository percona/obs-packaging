- PG_MAJOR_VERSION: 17
- PG_MINOR_VERSION: %!{PG_17_MINOR_VERSION}
- PG_VERSION: %!{PG_MAJOR_VERSION}.%!{PG_MINOR_VERSION}
- PERCONA_PG_PATCH_VERSION: 1
- PPG_IMAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}
- PGAUDIT_VERSION: 17.1
- TARBALL_PG_EXTRA_COMPONENTS: percona-pg_tde%!{PG_MAJOR_VERSION} percona-pg-telemetry%!{PG_MAJOR_VERSION}
- CONTAINER_PG_EXTRA_COMPONENTS: percona-pg_tde%!{PG_MAJOR_VERSION}
- PG_SOURCE_GIT_URL: https://github.com/percona/postgres.git
- PG_SOURCE_GIT_REVISION: PSP-%!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}
