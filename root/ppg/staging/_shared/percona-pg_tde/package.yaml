# QA: the pg_tde functional suite (ppg-testing pg_tde/core) against the
# installed packages. Runs for every PPG major that ships pg_tde (17, 18).
# Sections needing external key servers or two versions (vault, kmip,
# openbao, upgrade, minor_upgrade) and slow tests are skipped by default.
qa:
  - name: pg_tde
    pipeline: tde-core-parallel
    parameters:
      USE_OBS_REPO: true
      OBS_PROJECT: ${OBS_ROOTPRJ}:ppg:staging:%!{PG_MAJOR_VERSION}
      VERSION: ppg-%!{PG_VERSION}
      INSTALL_FROM_PACKAGES: true
      TEST_SUITE: All
      PLATFORMS:
        - debian-12
        - debian-12-arm
        - debian-13
        - debian-13-arm
        - ubuntu-jammy
        - ubuntu-jammy-arm
        - ubuntu-noble
        - ubuntu-noble-arm
        - ubuntu-resolute
        - ubuntu-resolute-arm
        - rocky-8
        - rocky-8-arm
        - rocky-9
        - rocky-9-arm
        - rocky-10
        - rocky-10-arm
        - ol-8
        - ol-8-arm
        - ol-9
        - ol-9-arm
        - ol-10
        - ol-10-arm
        - rhel-8
        - rhel-8-arm
        - rhel-9
        - rhel-9-arm
        - rhel-10
        - rhel-10-arm
      TESTING_BRANCH: main
