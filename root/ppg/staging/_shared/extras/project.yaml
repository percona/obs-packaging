# Shared project.yaml for every ppg:staging:<V>:extras subproject: each
# <V>/extras/project.yaml is a symlink to this file and renders it with the
# major's own macros.yaml.
title: Packages for PostgreSQL %!{PG_MAJOR_VERSION} Custom Images
description: |
  Packages for PostgreSQL %!{PG_MAJOR_VERSION} Custom Images — the server and the extensions

# This project's repository set and build configuration are unrelated to its
# parent's: declare them in full here instead of patching the inherited ones.
repositories-inherit: false

repositories:
  - name: UBI_9
    paths:
      - subproject: ppg:common:deps
        repository: UBI_9
      - subproject: common:deps:build
        repository: UBI_9
      - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
        repository: UBI_9
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: RedHat:UBI-9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9
        repository: devel
    archs: [x86_64, aarch64]

# UBI_9 build configuration, same as the PPG-wide block in
# root/ppg/staging/subprojects.yaml (which reaches direct children of the
# staging tier only, and this project is one level deeper).
project-config: |
  %if "%_repository" == "UBI_9"
  ExpandFlags: module:llvm-toolset-rhel9
  # hdf-libs (EPEL split package) and hdf both provide libdf.so.0 and libmfhdf.so.0
  Prefer: hdf-libs
  %endif
