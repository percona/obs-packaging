# Shared project.yaml for the PostgreSQL 14-17 majors of this tier: each
# <V>/project.yaml is a symlink to this file and renders it with its own
# macros.yaml (PG_MAJOR_VERSION etc.).  18 and 19 have their own files
# because their llvm-21 and SUSE Ignore policy differs.
title: Percona Distribution for PostgreSQL %!{PG_MAJOR_VERSION}
description: |
  Packages for Percona Distribution for PostgreSQL %!{PG_MAJOR_VERSION} — the server, extensions,
  HA components (Patroni, etcd, HAProxy, pgBouncer, pgPool-II), and companion tools.

# Repositories, debuginfo flags and the shared build configuration come from
# root/project.yaml and root/ppg/staging/subprojects.yaml.  Only what is
# specific to this major is declared here.
project-config: |
  %if "%_repository" == "openSUSE_Tumbleweed" || "%_repository" == "openSUSE_Leap_16"
  # Suppress the ppg:staging:18 system package so that this project does not
  # pick it up when both majors are present in the interconnect.
  Ignore: postgresql18-server
  %endif

  %if "%_repository" == "Debian_12" || "%_repository" == "Ubuntu_22.04"
  # Repackaged LLVM 21 (built for Debian 12) is only for PPG 18 JIT.
  # For PPG 14–17, Ignore it so builds use the distro LLVM packages.
  Ignore: libllvm21
  Ignore: llvm-21-runtime
  Ignore: llvm-21-linker-tools
  Ignore: libclang-cpp21
  Ignore: libclang-common-21-dev
  Ignore: libclang1-21
  Ignore: llvm-21-tools
  Ignore: llvm-21
  Ignore: llvm-21-dev
  Ignore: clang-21
  %endif

# QA: the QA team's test jobs for this major's packages, run by the PR check
# (qa-packages label), the nightly QA and release QA. OBS_PROJECT points the
# jobs at ${OBS_ROOTPRJ}:ppg:staging:<major>: this project on main, the PR's
# own copy (isv:percona:PR:pr-<N>:ppg:staging:<major>) in a PR.
qa:
  pipeline: ppg-multiOS-parallel
  parameters:
    USE_OBS_REPO: true
    OBS_PROJECT: ${OBS_ROOTPRJ}:ppg:staging:%!{PG_MAJOR_VERSION}
    VERSION: ppg-%!{PG_VERSION}
    PLATFORMS:
      - rocky-9
      - debian-13
      - ubuntu-noble
    TESTING_BRANCH: main
    SCENARIO:
      - pg-%!{PG_MAJOR_VERSION}
      - pg-%!{PG_MAJOR_VERSION}-meta-server
      - pg-%!{PG_MAJOR_VERSION}-meta-ha
  matrix:
    - SCENARIO
