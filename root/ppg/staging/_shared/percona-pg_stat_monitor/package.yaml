# QA: pg_stat_monitor's own regression suite against the installed package
# (PGSM_PACKAGE_INSTALL), checked out at the tag obs/_service builds from.
# Runs for every PPG major that ships the package.
qa:
  - name: pg_stat_monitor
    pipeline: pgsm-parallel
    parameters:
      USE_OBS_REPO: true
      OBS_PROJECT: ${OBS_ROOTPRJ}:ppg:staging:%!{PG_MAJOR_VERSION}
      VERSION: ppg-%!{PG_VERSION}
      PGSM_PACKAGE_INSTALL: true
      PGSM_REPO: https://github.com/percona/pg_stat_monitor.git
      PGSM_BRANCH: "%!{PG_STAT_MONITOR_VERSION}"
      PLATFORMS:
        - debian-12
        - debian-12-arm
        - debian-13
        - debian-13-arm
        - ubuntu-jammy
        - ubuntu-jammy-arm
        - ubuntu-noble
        - ubuntu-noble-arm
        - ubuntu-resolute
        - ubuntu-resolute-arm
        - rocky-8
        - rocky-8-arm
        - rocky-9
        - rocky-9-arm
        - rocky-10
        - rocky-10-arm
        - ol-8
        - ol-8-arm
        - ol-9
        - ol-9-arm
        - ol-10
        - ol-10-arm
        - rhel-8
        - rhel-8-arm
        - rhel-9
        - rhel-9-arm
        - rhel-10
        - rhel-10-arm
      TESTING_BRANCH: main
