# Macros common to every PG major version under ppg/staging.
# Component versions (PGBOUNCER_VERSION, PG_TDE_VERSION, ...) and the
# PG_<major>_MINOR_VERSION macros live in root/macros.yaml so the devel and
# staging chains share them.  Version-specific macros (PG_MAJOR_VERSION,
# PGAUDIT_VERSION, ...) live in the per-version macros.yaml files and override
# these where needed.

# Extra Percona extensions installed in the distribution container images
# (percona-distribution-postgresql and -with-postgis).  Empty by default; majors
# that ship pg_tde / pg_oidc_validator override it in their own macros.yaml.
- CONTAINER_PG_EXTRA_COMPONENTS:
# Extra extensions that depend on PostGIS, installed only in the images that
# ship it (-with-postgis and the extras custom image).  Empty by default;
# staging:19 adds address_standardizer and postgis_tiger_geocoder here.
- CONTAINER_POSTGIS_EXTRA_COMPONENTS:
# Extras extensions installed in the custom (extras) image only where the
# major supports them.  Every extras major ships both today; a major whose
# PG version they do not build against overrides it empty.  The
# value is pasted into the Dockerfile, so it uses the image's own
# ${PPG_MAJOR_VERSION} build argument: PG_MAJOR_VERSION is not defined yet at
# this level.
- CUSTOM_IMAGE_EXTRA_COMPONENTS: percona-timescaledb_${PPG_MAJOR_VERSION} percona-pgvectorscale_${PPG_MAJOR_VERSION}
# Extra Percona extensions bundled in the binary tarballs.  Empty by default;
# majors that ship pg_tde / pg_oidc_validator override it in their own
# macros.yaml.
- TARBALL_PG_EXTRA_COMPONENTS:
# I/O methods the metapackages' package tests run with (their package.yaml):
# PG 18 and later test all three; earlier majors ignore IO_METHOD, so one.
- QA_IO_METHODS: [worker]

# How a package shared with the devel tier (root/ppg/devel/ links into this
# tier's sources) gets its version; root/ppg/devel/macros.yaml overrides
# both.  In staging the version is the one pinned by the package's _VERSION
# macro (the "version" param of obs_scm): the versionformat is empty, which
# obs_scm ignores, and the Debian files keep the version and revision
# rendered into them.  Devel sets a format, which takes precedence over the
# pinned version.
- SCM_VERSIONFORMAT:
- SET_VERSION_DEB_MODE: disabled
# Epoch prefix of the percona-postgresql-common binaries, used in the
# relations that package declares on its own postgresql-common.  Devel
# empties it: the buildtime set_version step there drops the epoch.
- POSTGRESQL_COMMON_DEB_EPOCH: 1:
