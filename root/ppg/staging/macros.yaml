# Macros common to every PG major version under ppg/staging.
# Component versions (PGBOUNCER_VERSION, PG_TDE_VERSION, ...) and the
# PG_<major>_MINOR_VERSION macros live in root/macros.yaml so the devel and
# staging chains share them.  Version-specific macros (PG_MAJOR_VERSION,
# PGAUDIT_VERSION, ...) live in the per-version macros.yaml files and override
# these where needed.

# Extra Percona extensions installed in the distribution container images
# (percona-distribution-postgresql and -with-postgis).  Empty by default; majors
# that ship pg_tde / pg_oidc_validator override it in their own macros.yaml.
- CONTAINER_PG_EXTRA_COMPONENTS:
