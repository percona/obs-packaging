- PG_MAJOR_VERSION: 16
- PG_MINOR_VERSION: %!{PG_16_MINOR_VERSION}
- PG_VERSION: %!{PG_MAJOR_VERSION}.%!{PG_MINOR_VERSION}

- PG_SOURCE_GIT_URL: https://github.com/postgres/postgres.git
# Upstream has not tagged this minor yet: build the release stamp commit at
# the tip of the stable branch. Switch back to the tag
# (REL_%!{PG_MAJOR_VERSION}_%!{PG_MINOR_VERSION}) once it exists; same commit,
# so the switch uploads identical sources and rebuilds nothing.
- PG_SOURCE_GIT_REVISION: REL_%!{PG_MAJOR_VERSION}_STABLE

- PPG_IMAGE_VERSION: %!{PG_VERSION}

- PGAUDIT_VERSION: 16.1
- CONTAINER_PG_EXTRA_COMPONENTS: percona-pg-telemetry%!{PG_MAJOR_VERSION}
