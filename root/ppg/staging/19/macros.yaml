- PG_MAJOR_VERSION: 19
- PG_MINOR_VERSION: %!{PG_19_MINOR_VERSION}
- PERCONA_PG_PATCH_VERSION: %!{PG_19_PERCONA_PATCH_VERSION}
- PG_VERSION_SUFFIX: ~beta4
- PG_VERSION: %!{PG_MAJOR_VERSION}.%!{PG_MINOR_VERSION}

- PG_SOURCE_GIT_URL: https://github.com/percona/postgres.git
# TODO: replace the pinned commit by the beta4 tag once it exists
- PG_SOURCE_GIT_REVISION: 8d3bd20cbf647490ab2b88550213e9b478c9093a
- PG_PACKAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}%!{PG_VERSION_SUFFIX}

- PPG_IMAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}

# PG19-specific component versions; everything else inherits root/macros.yaml.
- PGAUDIT_VERSION: 19beta4
- HAPROXY_VERSION: 2.8.28
- POSTGIS_VERSION: 3.7.0rc2
# wal2json 2.7 is the first release with PG 19 support; the other majors stay
# on the root WAL2JSON_* values until the next release train bumps them.
- WAL2JSON_VERSION: 2.7
- WAL2JSON_TAG: wal2json_2_7
