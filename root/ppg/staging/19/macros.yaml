- PG_MAJOR_VERSION: 19
- PG_MINOR_VERSION: %!{PG_19_MINOR_VERSION}
- PERCONA_PG_PATCH_VERSION: %!{PG_19_PERCONA_PATCH_VERSION}
- PG_VERSION_SUFFIX: ~beta4
- PG_VERSION: %!{PG_MAJOR_VERSION}.%!{PG_MINOR_VERSION}

- PG_SOURCE_GIT_URL: https://github.com/percona/postgres.git
# TODO: replace the pinned commit by the beta4 tag once it exists
- PG_SOURCE_GIT_REVISION: 8d3bd20cbf647490ab2b88550213e9b478c9093a
- PG_PACKAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}%!{PG_VERSION_SUFFIX}

- PPG_IMAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}

# PG19-specific component versions; everything else inherits root/macros.yaml.
- PGAUDIT_VERSION: 19beta4
- HAPROXY_VERSION: 2.8.28
- POSTGIS_VERSION: 3.7.0rc2
- POSTGIS_RPM_MAJOR: 37
# wal2json 2.7 is the first release with PG 19 support; the other majors stay
# on the root WAL2JSON_* values until the next release train bumps them.
- WAL2JSON_VERSION: 2.7
- WAL2JSON_TAG: wal2json_2_7
# pg_tde has no PG 19 tag yet: build upstream main under a pre-release
# version that sorts below the next real release. Drop both lines once a
# PG 19 tag exists so the root PG_TDE_VERSION applies.
- PG_TDE_REVISION: main
- PG_TDE_VERSION: 2.3.0~dev

# PostGIS 3.7 split address_standardizer and postgis_tiger_geocoder out of its
# tree into their own packages; bundle them wherever PostGIS itself ships.
- TARBALL_PG_EXTRA_COMPONENTS: percona-pg_tde%!{PG_MAJOR_VERSION} percona-pg_oidc_validator%!{PG_MAJOR_VERSION} percona-address-standardizer%!{PG_MAJOR_VERSION} percona-postgis-tiger-geocoder%!{PG_MAJOR_VERSION}
- CONTAINER_PG_EXTRA_COMPONENTS: percona-pg_tde%!{PG_MAJOR_VERSION} percona-pg_oidc_validator%!{PG_MAJOR_VERSION}
- CONTAINER_POSTGIS_EXTRA_COMPONENTS: percona-address-standardizer%!{PG_MAJOR_VERSION} percona-address-standardizer%!{PG_MAJOR_VERSION}-llvmjit percona-postgis-tiger-geocoder%!{PG_MAJOR_VERSION}
