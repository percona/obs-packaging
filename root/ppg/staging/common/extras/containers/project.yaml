title: Percona Custom Container Images for PostgreSQL — shared across versions
description: |
  This project contains container images shared across the Percona Distribution for
  PostgreSQL major versions that ship the "extras" package set (currently 16-18), such as
  the custom major-version upgrade image that bundles those extra extensions. It is not tied
  to a single staging/<V>, so its OBS project is ppg:staging:common:extras:containers and its released
  counterpart is ppg:releases:common rather than a per-version releases/<V>/extras subproject.
  We currently build these images based on UBI-9 only, matching the per-version
  extras/containers projects (there is no UBI-8 variant of the extras/custom images).

# This project's repository set and build configuration are unrelated to its
# parent's: declare them in full here instead of patching the inherited ones.
repositories-inherit: false
project-config-inherit: false
# no debuginfo repositories here; do not inherit the staging map
debuginfo: ~

repositories:
  - name: ubi9
    paths:
      - project: RedHat:UBI:Registry
        repository: images
      - subproject: ppg:staging:18:extras
        repository: UBI_9
      - subproject: ppg:staging:17:extras
        repository: UBI_9
      - subproject: ppg:staging:16:extras
        repository: UBI_9
      - subproject: ppg:staging:18
        repository: UBI_9
      - subproject: ppg:staging:17
        repository: UBI_9
      - subproject: ppg:staging:16
        repository: UBI_9
      - subproject: ppg:common:deps
        repository: UBI_9
      - subproject: common:containers:ubi9
        repository: UBI_9
      - project: Fedora:EPEL:9
        repository: standard
      - project: RedHat:UBI-9
        repository: standard
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "ubi9"
  Type: docker
  BuildEngine: podman
  # OCI index + OCI manifests (ppg-testing requires OCI-only media types) with
  # gzip layers, so Docker < 23 can still pull the images.  Stock obs-build
  # only writes an OCI archive for non-gzip compression; the labs workers carry
  # a patch that also selects it for container-build-format:oci.
  BuildFlags: container-compression-format:gzip
  BuildFlags: container-build-format:oci
  BuildFlags: dockerarg:PPG_REPO=staging
  BuildFlags: dockerarg:RHEL_VER=el9
  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi9/ubi-minimal:latest

  Preinstall: skopeo

  ExpandFlags: filterbasecontainerpkgs
  Prefer: redhat-release
  Prefer: glibc-minimal-langpack
  Prefer: gpgme
  Prefer: iptables-nft
  Prefer: percona-postgresql%!{PG_MAJOR_VERSION}-libs
  Ignore: rocky-release

  BuildFlags: sbom:spdx
  BuildFlags: sbom:cyclonedx
  PublishFlags: withsbom
  %endif

# QA: custom-image upgrades with the mediator image built here.
qa:
  - name: ubi9-16-to-17
    pipeline: docker-server-parallel-custom-upgrade
    parameters:
      OLD_SERVER_VERSION: "16.%!{PG_16_MINOR_VERSION}"
      NEW_SERVER_VERSION: "17.%!{PG_17_MINOR_VERSION}"
      OLD_VERSION_DOCKER_TAG: "16"
      NEW_VERSION_DOCKER_TAG: "17"
      UPGRADE_DOCKER_TAG: "18-17-16"
      TESTING_BRANCH: main
      REPOSITORY:
        image: percona-distribution-postgresql-custom
        repository: ubi9
        project: ppg:staging:17:extras:containers
      OLD_REPOSITORY:
        image: percona-distribution-postgresql-custom
        repository: ubi9
        project: ppg:staging:16:extras:containers
      NEW_REPOSITORY:
        image: percona-distribution-postgresql-custom
        repository: ubi9
        project: ppg:staging:17:extras:containers
      UPGRADE_REPOSITORY:
        image: percona-distribution-postgresql-upgrade-custom
        repository: ubi9

  - name: ubi9-17-to-18
    pipeline: docker-server-parallel-custom-upgrade
    parameters:
      OLD_SERVER_VERSION: "17.%!{PG_17_MINOR_VERSION}"
      NEW_SERVER_VERSION: "18.%!{PG_18_MINOR_VERSION}"
      OLD_VERSION_DOCKER_TAG: "17"
      NEW_VERSION_DOCKER_TAG: "18"
      UPGRADE_DOCKER_TAG: "18-17-16"
      TESTING_BRANCH: main
      REPOSITORY:
        image: percona-distribution-postgresql-custom
        repository: ubi9
        project: ppg:staging:18:extras:containers
      OLD_REPOSITORY:
        image: percona-distribution-postgresql-custom
        repository: ubi9
        project: ppg:staging:17:extras:containers
      NEW_REPOSITORY:
        image: percona-distribution-postgresql-custom
        repository: ubi9
        project: ppg:staging:18:extras:containers
      UPGRADE_REPOSITORY:
        image: percona-distribution-postgresql-upgrade-custom
        repository: ubi9
