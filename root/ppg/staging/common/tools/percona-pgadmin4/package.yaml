title: pgAdmin 4 (server mode) for UBI-9
description: |
  pgAdmin 4 built from the upstream git tag (REL-9_17) with the SP1 npm vendoring
  chain (obs_scm -> npm_lockfile -> node_modules) and the Python 3.12 stack in
  ppg:common:deps:pgadmin. Subpackages: -gunicorn (launcher + systemd unit; the container runtime),
  -httpd (Apache httpd + mod_wsgi integration for hosts), -doc (documentation
  sources). Design: docs/superpowers/specs/2026-08-28-pgadmin4-package-design.md

# UBI 9 only; ppg:staging:common:tools builds the other tools for every distro.
build:
  RockyLinux_8: false
  RockyLinux_9: false
  RockyLinux_9.6: false
  RockyLinux_10: false
  UBI_8: false
  UBI_10: false
  Debian_12: false
  Debian_13: false
  Ubuntu_22.04: false
  Ubuntu_24.04: false
  Ubuntu_26.04: false
  openSUSE_Tumbleweed: false
  openSUSE_Leap_16: false
