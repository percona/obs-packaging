title: Percona Distribution for PostgreSQL upgrade image (target PG 18)
description: |
  The pg_upgrade mediator image that upgrades PostgreSQL 14, 15, 16 or 17 to 18, tagged
  18-17-16-15-14. It is the previous form of percona-distribution-postgresql-upgrade, kept as its
  own package next to the PG 19 image so the 18-17-16-15-14 tags keep receiving CVE fixes.

# QA: major-version upgrades with this image (target PG 18).
qa:
  - name: ubi8-14-to-15
    pipeline: docker-server-parallel-upgrade
    parameters:
      OLD_SERVER_VERSION: "14.%!{PG_14_MINOR_VERSION}"
      NEW_SERVER_VERSION: "15.%!{PG_15_MINOR_VERSION}"
      OLD_VERSION_DOCKER_TAG: "14"
      NEW_VERSION_DOCKER_TAG: "15"
      UPGRADE_DOCKER_TAG: "18-17-16-15-14"
      TESTING_BRANCH: main
      REPOSITORY:
        image: percona-distribution-postgresql   # names the plain image only; see "Image references" in docs
        repository: ubi8
        project: ppg:staging:15:containers
      OLD_REPOSITORY:
        image: percona-distribution-postgresql   # names the plain image only; see "Image references" in docs
        repository: ubi8
        project: ppg:staging:14:containers
      NEW_REPOSITORY:
        image: percona-distribution-postgresql   # names the plain image only; see "Image references" in docs
        repository: ubi8
        project: ppg:staging:15:containers
      UPGRADE_REPOSITORY:
        image: percona-distribution-postgresql-upgrade-18
        repository: ubi8
      WITH_POSTGIS:
        - true
        - false
    matrix:
      - WITH_POSTGIS

