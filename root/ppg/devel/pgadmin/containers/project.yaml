title: Percona pgAdmin 4 container image
description: |
  Container image for pgAdmin 4 (percona-pgadmin4), built from the
  ppg:devel:pgadmin RPMs on UBI 9. Bundles the Percona PostgreSQL client
  binaries for majors 14-18 so pgAdmin's Backup/Restore and external
  Query Tool features work against any supported server version.
  Design: docs/superpowers/specs/2026-09-02-pgadmin4-container-design.md

# A container project: its repository set and build config are its own, not the
# parent ppg:devel:pgadmin RPM project's. Declare them in full here instead of
# inheriting (same opt-out as the staging containers subprojects).
repositories-inherit: false
project-config-inherit: false
debuginfo: ~

repositories:
  - name: ubi9
    paths:
      - project: RedHat:UBI:Registry
        repository: images
      - subproject: ppg:devel:pgadmin
        repository: UBI_9
      - subproject: ppg:staging:18
        repository: UBI_9
      - subproject: ppg:staging:17
        repository: UBI_9
      - subproject: ppg:staging:16
        repository: UBI_9
      - subproject: ppg:staging:15
        repository: UBI_9
      - subproject: ppg:staging:14
        repository: UBI_9
      - subproject: ppg:common:deps
        repository: UBI_9
      - subproject: common:containers:ubi9
        repository: UBI_9
      - project: Fedora:EPEL:9
        repository: standard
      - project: RedHat:UBI-9
        repository: standard
    archs: [x86_64, aarch64]

project-config: |
  Type: docker
  BuildEngine: podman
  BuildFlags: sbom:spdx
  BuildFlags: sbom:cyclonedx
  PublishFlags: withsbom
  # The retired kiwi base project set these for every image; the image
  # projects carry them themselves now that the base comes from the registry.
  BuildFlags: container-compression-format:zstd
  BuildFlags: container-build-format:oci

  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi9/ubi-minimal:latest

  Preinstall: skopeo

  ExpandFlags: filterbasecontainerpkgs

  Prefer: redhat-release
  Prefer: glibc-minimal-langpack
  Prefer: gpgme
  Prefer: iptables-nft
  Prefer: percona-postgresql18-libs
  Ignore: rocky-release
  Substitute: rocky-release redhat-release
