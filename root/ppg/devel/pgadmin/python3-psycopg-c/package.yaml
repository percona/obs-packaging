title: psycopg-c 3.3.4 for Python 3.12
description: |
  PostgreSQL database adapter for Python -- C optimisation distribution. RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4). Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).
