title: Authlib 1.6.12 for Python 3.12
description: |
  The ultimate Python library in building OAuth and OpenID Connect servers and clients. RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4). Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).
