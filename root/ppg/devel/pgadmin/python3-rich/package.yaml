title: rich 15.0.0 for Python 3.12
description: |
  Render rich text, tables, progress bars, syntax highlighting, markdown and more to the terminal. RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4). Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).
