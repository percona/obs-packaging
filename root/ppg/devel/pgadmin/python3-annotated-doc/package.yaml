title: annotated-doc 0.0.5 for Python 3.12
description: |
  Document parameters, class attributes, return types, and variables inline, with Annotated. RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4). Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).
