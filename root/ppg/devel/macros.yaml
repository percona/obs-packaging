# Macros common to every project under ppg/devel.  Devel links to the staging
# packaging (root/ppg/staging/_shared/<pkg>, root/ppg/staging/common/tools/<pkg>)
# and differs only in what these macros render into obs/_service.

# Devel builds a branch: the version is the nearest tag plus the commit
# offset (a set versionformat overrides the version staging pins), and the
# second set_version step stamps it on the Debian files (staging keeps that
# step disabled).
- SCM_VERSIONFORMAT: @PARENT_TAG@+@TAG_OFFSET@
- SET_VERSION_DEB_MODE: buildtime
# The buildtime set_version step writes the version without the epoch staging
# pins, so the relations percona-postgresql-common declares on its own
# postgresql-common must not carry one either.
- POSTGRESQL_COMMON_DEB_EPOCH:

# Upstream development branch of each component (staging: a release tag).
- ADDRESS_STANDARDIZER_REF: main
- HAPROXY_REF: master
- PATRONI_REF: master
- PGBACKREST_REF: main
- PGBADGER_REF: master
- PGBOUNCER_REF: master
- PGAUDIT_SET_USER_REF: main
- PGPOOL_REF: master
- PGVECTOR_REF: master
- PG_CRON_REF: main
- PG_GATHER_REF: main
- PG_OIDC_VALIDATOR_REF: main
- PG_REPACK_REF: master
- PG_STAT_MONITOR_REF: main
- PG_TDE_REVISION: main
- POSTGRESQL_COMMON_REF: master
- POSTGIS_TIGER_GEOCODER_REF: main
- PSYCOPG2_REF: master
- WAL2JSON_REF: master
