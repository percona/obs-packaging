- PG_MAJOR_VERSION: 19
- PG_MINOR_VERSION: %!{PG_19_MINOR_VERSION}
- PERCONA_PG_PATCH_VERSION: %!{PG_19_PERCONA_PATCH_VERSION}
- PG_VERSION_SUFFIX: dev
- PG_VERSION: %!{PG_MAJOR_VERSION}.%!{PG_MINOR_VERSION}

- PG_SOURCE_GIT_URL: https://github.com/percona/postgres.git
- PG_SOURCE_GIT_REVISION: PSP_REL_%!{PG_MAJOR_VERSION}_STABLE
- PG_PACKAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}%!{PG_VERSION_SUFFIX}

# devel:19-only components; everything else inherits root/macros.yaml.
# pgAudit keeps one branch per PostgreSQL major (its main moves on to the next
# major), so devel:19 follows the PG 19 branch rather than main.
- PGAUDIT_VERSION: 19.0
- PGAUDIT_REF: REL_19_STABLE
