- PG_MAJOR_VERSION: 18
- PG_MINOR_VERSION: %!{PG_18_MINOR_VERSION}
- PERCONA_PG_PATCH_VERSION: %!{PG_18_PERCONA_PATCH_VERSION}
- PG_VERSION: %!{PG_MAJOR_VERSION}.%!{PG_MINOR_VERSION}
- PG_VERSION_SUFFIX: dev

- PG_SOURCE_GIT_URL: https://github.com/percona/postgres.git
- PG_SOURCE_GIT_REVISION: PSP_REL_%!{PG_MAJOR_VERSION}_STABLE
- PG_PACKAGE_VERSION: %!{PG_VERSION}.%!{PERCONA_PG_PATCH_VERSION}%!{PG_VERSION_SUFFIX}
