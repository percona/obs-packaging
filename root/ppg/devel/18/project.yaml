project-config: |
  %if "%_repository" == "RockyLinux_8" || "%_repository" == "UBI_8"
  ExpandFlags: module:llvm-toolset-rhel8
  ExpandFlags: module:perl-5.26
  ExpandFlags: module:perl-IO-Socket-SSL-2.066
  ExpandFlags: module:perl-libwww-perl-6.34
  Prefer: python3-devel
  Prefer: atlas
  Prefer: selinux-policy-targeted
  %endif

  %if "%_repository" == "RockyLinux_9" || "%_repository" == "UBI_9"
  ExpandFlags: module:llvm-toolset-rhel9
  # hdf-libs (EPEL split package) and hdf both provide libdf.so.0 and libmfhdf.so.0
  Prefer: hdf-libs
  %endif

  %if "%_repository" == "RockyLinux_10"
  Prefer: selinux-policy-targeted
  Prefer: hdf-libs

  Macros:
  %__brp_check_rpaths %{nil}
  :Macros
  %endif

  %if "%_repository" == "openSUSE_Tumbleweed"
  # percona-postgresql18-server conflicts with the SUSE postgresql-server and
  # postgresql18-server packages (both own /var/lib/pgsql). The DNF stack
  # (pulled in by yum-utils) recommends postgresql-server on Tumbleweed.
  # Suppress those packages entirely so that postgresql-server requirements
  # resolve to percona-postgresql18-server via its Provides. Also suppress the
  # ppg:17 system package (postgresql17-server) so that this project does not
  # pick it up when both majors are present in the interconnect.
  Prefer: percona-postgresql18-server
  # Our python3-dateutil and python3-six packages shadow the SUSE system packages
  # (python313-python-dateutil, python313-six). Prefer system packages so that
  # build deps like python3-dnf-plugins-core and python3-libmodulemd resolve correctly.
  Prefer: python313-python-dateutil
  Prefer: python313-six
  Ignore: postgresql17-server
  Ignore: postgresql-server
  Ignore: postgresql
  %endif

  %if "%_repository" == "openSUSE_Leap_16"
  # Same conflict as Tumbleweed: the system PostgreSQL packages conflict with
  # percona-postgresql18-server. Suppress them so dependencies resolve correctly.
  Prefer: percona-postgresql18-server
  # Our python3-dateutil and python3-six packages shadow the SUSE system packages
  # (python313-python-dateutil, python313-six). Prefer system packages so that
  # build deps like python3-dnf-plugins-core and python3-libmodulemd resolve correctly.
  Prefer: python313-python-dateutil
  Prefer: python313-six
  Ignore: postgresql17-server
  Ignore: postgresql-server
  Ignore: postgresql
  %endif

  %if "%_repository" == "Debian_11"
  # llvm-11-dev needs libtinfo-dev; on Bullseye both libncurses-dev and
  # libtinfo-dev satisfy it and OBS reports "have choice" without a Prefer.
  Prefer: libncurses-dev
  # logrotate Recommends a cron daemon; Bullseye has both cron and bcron.
  Prefer: cron
  # PG 18 JIT requires LLVM >= 19; use repackaged llvm-21 from common:deps:build.
  Prefer: llvm-21-dev
  Prefer: clang-21
  Substitute: llvm-dev llvm-21-dev
  Substitute: clang clang-21
  # Force the whole llvm-21 toolchain into every Debian 11 build root. clang-21/
  # llvm-21-dev pull the rest transitively but an inherited Ignore strips them,
  # and extensions (pgvector, postgis) need clang-21 for PGXS bitcode yet only
  # Build-Depend on the server-dev package. Support: beats the Ignore.
  Support: clang-21
  Support: llvm-21-dev
  Support: libllvm21
  Support: libclang-cpp21
  Support: libclang-common-21-dev
  Support: llvm-21-linker-tools
  Support: libclang1-21
  Support: llvm-21
  Support: llvm-21-runtime
  Support: llvm-21-tools
  Support: libc++-21-dev
  Support: libc++abi-21-dev
  Support: libc++1-21
  Support: libc++abi1-21
  Support: python3-distutils
  Ignore: libllvm11
  Ignore: llvm-11-runtime
  Ignore: llvm-11-linker-tools
  Ignore: libclang-cpp11
  Ignore: libclang-common-11-dev
  Ignore: libclang1-11
  Ignore: llvm-11-tools
  Ignore: llvm-11
  Ignore: llvm-11-dev
  Ignore: clang-11
  %endif

  %if "%_repository" == "Debian_11" || "%_repository" == "Debian_13" || "%_repository" == "Ubuntu_24.04"
  Prefer: golang-1.26
  %endif

  %if "%_repository" == "Debian_11" || "%_repository" == "Debian_13" || "%_repository" == "Ubuntu_24.04" || "%_repository" == "Ubuntu_26.04"
  # libgdal-dev transitively requires both libcurl4-openssl-dev and
  # libcurl4-gnutls-dev which conflict; ignore the gnutls variant so
  # the openssl variant is used consistently.
  Ignore: libcurl4-gnutls-dev
  # libgdal-dev and several of its deps use libjpeg-dev which is provided
  # by both libjpeg62-turbo-dev and libjpeg-dev; prefer the turbo variant.
  Prefer: libjpeg62-turbo-dev
  %endif