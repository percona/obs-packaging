build: false
description: 'Containers subproject for ppg:releases:common:tools.

  Builds are disabled; binaries are copied via osc release.

  '
project-config: '# --- from root/ppg/staging/common/tools/containers/project.yaml
  ---

  Type: docker

  BuildEngine: podman

  BuildFlags: sbom:spdx

  BuildFlags: sbom:cyclonedx

  PublishFlags: withsbom

  # OCI index + OCI manifests (ppg-testing requires OCI-only media types) with

  # gzip layers, so Docker < 23 can still pull the images.  Stock obs-build

  # only writes an OCI archive for non-gzip compression; the labs workers carry

  # a patch that also selects it for container-build-format:oci.

  BuildFlags: container-compression-format:gzip

  BuildFlags: container-build-format:oci


  Preinstall: skopeo


  ExpandFlags: filterbasecontainerpkgs


  Prefer: redhat-release

  Prefer: glibc-minimal-langpack

  Prefer: gpgme

  Prefer: iptables-nft

  # curl/libcurl 8.23.0 (ppg:common:deps) vs the UBI curl-minimal/

  # libcurl-minimal: both provide libcurl.so.4 / curl, so prefer ours.

  Prefer: libcurl

  Prefer: curl

  Prefer: percona-postgresql18-libs

  Ignore: rocky-release

  Substitute: rocky-release redhat-release


  BuildFlags: dockerarg:PPG_REPO=staging


  %if "%_repository" == "ubi8"


  ExpandFlags: module:container-tools-rhel8

  # Only the perl:5.26 stream is enabled: its artifacts are plain RPMs. Any

  # other stream would expose .module+ packages that microdnf rejects inside

  # the real ubi8/ubi-minimal image. UBI 8 AppStream carries BOTH copies of

  # perl-IO-Socket-SSL, perl-Net-SSLeay and perl-Mozilla-CA and the expander

  # takes the modular one (its release string sorts higher), so

  # common:containers:ubi8 (earlier in the path) shadows them with non-modular

  # rebuilds, and adds perl-DBD-Pg and llvm which UBI 8 only has as streams.

  ExpandFlags: module:perl-5.26

  # redhat-rpm-config (pulled by perl -> perl-devel on EL8) requires these files;

  # OBS needs the mapping to put findutils into the image''s package repository.

  FileProvides: /usr/bin/find findutils

  FileProvides: /usr/bin/xargs findutils


  BuildFlags: dockerarg:RHEL_VER=el8

  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi8/ubi-minimal:latest


  %endif


  %if "%_repository" == "ubi9"


  BuildFlags: dockerarg:RHEL_VER=el9

  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi9/ubi-minimal:latest

  # TEMPORARY (2026-11-11): UBI 9 appstream ships netavark 3:1.17.2 requiring

  # aardvark-dns >= 3:1.17, but only aardvark-dns 2:1.17.1 is published, so

  # the podman build environment is unresolvable.  Build-env only; drop once

  # Red Hat publishes the matching aardvark-dns.

  Ignore: netavark:aardvark-dns


  %endif


  %if "%_repository" == "ubi10"


  BuildFlags: dockerarg:RHEL_VER=el10

  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi10/ubi-minimal:latest


  # EL10''s atk pulls in at-spi2-core, which requires /usr/bin/xprop; the

  # expander needs the hint to pull xprop (UBI 10 AppStream) into the build root.

  FileProvides: /usr/bin/xprop xprop


  # containers-common-extra: UBI 10 ships crun, not runc.

  Prefer: crun

  # EL10''s system Python is 3.12, so the distro python3-* packages also

  # provide python3.12-*: take the distro package where UBI 10 ships it …

  Prefer: python3-attrs python3-dateutil python3-dns python3-six python3-wcwidth

  Prefer: python3-jmespath python3-prettytable python3-psutil

  # … and ours where only EPEL has it (the Percona repo must work without EPEL)

  # or where ours is built against Percona libpq (psycopg2).

  Prefer: python3.12-click python3.12-boto3 python3.12-botocore python3.12-lz4 python3.12-s3transfer

  Prefer: python3.12-psycopg2 python3.12-etcd


  %endif

  '
