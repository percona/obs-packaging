build: false
debuginfo:
  RockyLinux_9: true
  RockyLinux_9.6: true
  openSUSE_Leap_16: true
  openSUSE_Tumbleweed: true
description: 'Release project for ppg:staging:16:tde (OBS project ppg:releases:16:tde).

  Binaries are populated by osc release and builds are disabled.

  This project is read-only — do not add or edit packages directly.

  '
project-config: '# --- from root/ppg/staging/16/tde/project.yaml ---

  %if "%_repository" == "RockyLinux_8"

  ExpandFlags: module:llvm-toolset-rhel8

  ExpandFlags: module:perl-5.26

  ExpandFlags: module:perl-IO-Socket-SSL-2.066

  ExpandFlags: module:perl-libwww-perl-6.34

  Prefer: python3-devel

  Prefer: atlas

  Prefer: selinux-policy-targeted

  %endif


  %if "%_repository" == "RockyLinux_9" || "%_repository" == "RockyLinux_9.6"

  ExpandFlags: module:llvm-toolset-rhel9

  # hdf-libs (EPEL split package) and hdf both provide libdf.so.0 and libmfhdf.so.0

  Prefer: hdf-libs

  %endif


  %if "%_repository" == "RockyLinux_9.6"

  # EPEL 9 tracks the latest RHEL 9 minor and ships llvm19-libs as a compat

  # package for the newer distro LLVM. On the 9.6 baseline the distro

  # llvm-libs (19.1.7) provides the same libLLVM.so.19.1, so OBS reports

  # "have choice" (e.g. for annobin). The 9.6 toolchain (llvm-devel,

  # clang-libs) hard-requires llvm-libs = 19.1.7, so prefer the distro

  # package over the EPEL compat one.

  Prefer: llvm-libs

  # armadillo (EPEL, gdal chain for postgis) needs liblapack.so.3, which

  # both lapack and lapack64 provide in 9.6; the same split exists for

  # libblas.so.3 (blas/blas64). Prefer the standard LP64 variants.

  Prefer: lapack

  Prefer: blas

  %endif


  %if "%_repository" == "RockyLinux_10"

  Prefer: selinux-policy-targeted

  Prefer: hdf-libs


  Macros:

  %__brp_check_rpaths %{nil}

  :Macros

  %endif


  %if "%_repository" == "openSUSE_Tumbleweed"

  # percona-postgresql17-server conflicts with postgresql18-server and the

  # postgresql-server-18 meta-package (both own /var/lib/pgsql). The DNF stack

  # (pulled in by percona-telemetry-agent -> yum-utils) recommends postgresql18-server

  # on Tumbleweed. Suppress those packages entirely so that postgresql-server

  # requirements resolve to percona-postgresql17-server via its Provides. Also

  # suppress the ppg:18 system package (postgresql18-server) so that this project

  # does not pick it up when both majors are present in the interconnect.

  Prefer: percona-postgresql16-server

  # Our python3-dateutil and python3-six packages shadow the SUSE system packages

  # (python313-python-dateutil, python313-six). Prefer system packages so that

  # build deps like python3-dnf-plugins-core and python3-libmodulemd resolve correctly.

  Prefer: python313-python-dateutil

  Prefer: python313-six

  Ignore: postgresql18-server

  Ignore: postgresql-server

  Ignore: postgresql

  %endif


  %if "%_repository" == "openSUSE_Leap_16"

  # Same conflict as Tumbleweed: the system PostgreSQL packages conflict with

  # percona-postgresql17-server. Suppress them so dependencies resolve correctly.

  Prefer: percona-postgresql16-server

  # Our python3-dateutil and python3-six packages shadow the SUSE system packages

  # (python313-python-dateutil, python313-six). Prefer system packages so that

  # build deps like python3-dnf-plugins-core and python3-libmodulemd resolve correctly.

  Prefer: python313-python-dateutil

  Prefer: python313-six

  Ignore: postgresql18-server

  Ignore: postgresql-server

  Ignore: postgresql

  %endif


  %if "%_repository" == "Debian_13" || "%_repository" == "Ubuntu_22.04" || "%_repository"
  == "Ubuntu_24.04"

  Prefer: golang-1.26

  %endif


  %if "%_repository" == "Debian_13" || "%_repository" == "Ubuntu_22.04" || "%_repository"
  == "Ubuntu_24.04" || "%_repository" == "Ubuntu_26.04"

  # libgdal-dev transitively requires both libcurl4-openssl-dev and

  # libcurl4-gnutls-dev which conflict; ignore the gnutls variant so

  # the openssl variant is used consistently.

  Ignore: libcurl4-gnutls-dev

  # libgdal-dev and several of its deps use libjpeg-dev which is provided

  # by both libjpeg62-turbo-dev and libjpeg-dev; prefer the turbo variant.

  Prefer: libjpeg62-turbo-dev

  %endif


  # Same as the root project.yaml Debian_12 block (this project opts out

  # of the inherited build configuration): prefer the Percona libcurl4t64

  # (ppg:common:deps/curl) over the distro libcurl4.

  %if "%_repository" == "Debian_12"

  Prefer: libcurl4t64

  %endif


  # Distro codename suffix for deb releases — keep in sync with the root

  # project.yaml (this project opts out of the inherited build

  # configuration, so the block is repeated here).

  %if "%_repository" == "Debian_12"

  Release: <CI_CNT>.<B_CNT>.bookworm

  %endif

  %if "%_repository" == "Debian_13"

  Release: <CI_CNT>.<B_CNT>.trixie

  %endif

  %if "%_repository" == "Ubuntu_22.04"

  Release: <CI_CNT>.<B_CNT>.jammy

  %endif

  %if "%_repository" == "Ubuntu_24.04"

  Release: <CI_CNT>.<B_CNT>.noble

  %endif

  %if "%_repository" == "Ubuntu_26.04"

  Release: <CI_CNT>.<B_CNT>.resolute

  %endif


  # RPM dist tag in the release — keep in sync with the root project.yaml

  # (this project opts out of the inherited build configuration).

  %if "%_repository" == "RockyLinux_8" || "%_repository" == "RockyLinux_9" || "%_repository"
  == "RockyLinux_9.6" || "%_repository" == "RockyLinux_10"

  Release: <CI_CNT>.<B_CNT> spec:<CI_CNT>.<B_CNT>%%{?dist}

  %endif'
qa:
- matrix:
  - SCENARIO
  name: server
  parameters:
    OBS_PROJECT: ${OBS_ROOTPRJ}:ppg:releases:16:tde
    PLATFORMS:
    - debian-13
    - debian-13-arm
    - ubuntu-jammy
    - ubuntu-jammy-arm
    - ubuntu-noble
    - ubuntu-noble-arm
    - ubuntu-resolute
    - ubuntu-resolute-arm
    - rocky-8
    - rocky-8-arm
    - rocky-9
    - rocky-9-arm
    - rocky-10
    - rocky-10-arm
    - ol-8
    - ol-8-arm
    - ol-9
    - ol-9-arm
    - ol-10
    - ol-10-arm
    - rhel-8
    - rhel-8-arm
    - rhel-9
    - rhel-9-arm
    - rhel-10
    - rhel-10-arm
    SCENARIO:
    - pg-16
    - pg-16-meta-server
    - pg-16-meta-ha
    TESTING_BRANCH: main
    USE_OBS_REPO: true
    VERSION: ppg-16.16
  pipeline: ppg-multiOS-parallel
