build: false
description: 'Extras:containers subproject for ppg:releases:18.

  Builds are disabled; binaries are copied via osc release.

  '
project-config: '# --- from root/ppg/staging/18/extras/containers/project.yaml ---

  %if "%_repository" == "ubi9"

  Type: docker

  BuildEngine: podman

  # OCI index + OCI manifests (ppg-testing requires OCI-only media types) with

  # gzip layers, so Docker < 23 can still pull the images.  Stock obs-build

  # only writes an OCI archive for non-gzip compression; the labs workers carry

  # a patch that also selects it for container-build-format:oci.

  BuildFlags: container-compression-format:gzip

  BuildFlags: container-build-format:oci

  BuildFlags: dockerarg:PPG_REPO=staging

  BuildFlags: dockerarg:RHEL_VER=el9

  BuildFlags: dockerarg:UBI_BASE=registry.access.redhat.com/ubi9/ubi-minimal:latest


  Preinstall: skopeo


  ExpandFlags: filterbasecontainerpkgs

  Prefer: redhat-release

  Prefer: glibc-minimal-langpack

  Prefer: gpgme

  Prefer: iptables-nft

  Prefer: percona-postgresql18-libs

  Ignore: rocky-release


  Prefer: glibc-minimal-langpack


  BuildFlags: sbom:spdx

  BuildFlags: sbom:cyclonedx

  PublishFlags: withsbom

  %endif

  '
