build: false
description: 'Extras subproject for ppg:releases:18.

  Builds are disabled; binaries are copied via osc release.

  '
project-config: '# --- from root/project.yaml ---

  # Distro-wide build configuration inherited by every project under root/.

  # Project-specific lines live in the project''s own project.yaml (or in a

  # tier''s subprojects.yaml); the tool concatenates them and marks each block

  # with a "# --- from <file> ---" header.  See root/README.md.

  %if "%_repository" == "RockyLinux_8" || "%_repository" == "UBI_8"

  ExpandFlags: module:llvm-toolset-rhel8

  ExpandFlags: module:perl-5.26

  ExpandFlags: module:perl-IO-Socket-SSL-2.066

  ExpandFlags: module:perl-libwww-perl-6.34

  Prefer: selinux-policy-targeted

  %endif


  %if "%_repository" == "RockyLinux_9" || "%_repository" == "RockyLinux_9.6"

  ExpandFlags: module:llvm-toolset-rhel9

  # hdf-libs (EPEL split package) and hdf both provide libdf.so.0 and libmfhdf.so.0

  Prefer: hdf-libs

  %endif


  %if "%_repository" == "RockyLinux_9.6"

  # EPEL 9 tracks the latest RHEL 9 minor and ships llvm19-libs as a compat

  # package for the newer distro LLVM. On the 9.6 baseline the distro

  # llvm-libs (19.1.7) provides the same libLLVM.so.19.1, so OBS reports

  # "have choice" (e.g. for annobin). The 9.6 toolchain (llvm-devel,

  # clang-libs) hard-requires llvm-libs = 19.1.7, so prefer the distro

  # package over the EPEL compat one.

  Prefer: llvm-libs

  # armadillo (EPEL, gdal chain for postgis) needs liblapack.so.3, which

  # both lapack and lapack64 provide in 9.6; the same split exists for

  # libblas.so.3 (blas/blas64). Prefer the standard LP64 variants.

  Prefer: lapack

  Prefer: blas

  %endif


  %if "%_repository" == "UBI_10"

  # RHEL 10 appstream ships llvm-libs 21 and EPEL 10 ships llvm21-libs; both

  # provide libLLVM.so.21.1, so OBS reports "have choice" for rust (seen on

  # common:deps:build/cargo-pgrx-*). Prefer the distro package, as the

  # RockyLinux_9.6 block above does.

  Prefer: llvm-libs

  %endif


  %if "%_repository" == "Debian_12" || "%_repository" == "Ubuntu_22.04"

  # llvm-*-dev needs libtinfo-dev; both libncurses-dev and libtinfo-dev satisfy

  # it and OBS reports "have choice" without a Prefer.

  Prefer: libncurses-dev

  # logrotate Recommends a cron daemon; both cron and bcron may be available.

  Prefer: cron

  %endif


  %if "%_repository" == "Debian_12" || "%_repository" == "Debian_13" || "%_repository"
  == "Ubuntu_22.04" || "%_repository" == "Ubuntu_24.04"

  Prefer: golang-1.26

  %endif


  %if "%_repository" == "Debian_12" || "%_repository" == "Debian_13" || "%_repository"
  == "Ubuntu_22.04" || "%_repository" == "Ubuntu_24.04" || "%_repository" == "Ubuntu_26.04"

  # libgdal-dev transitively requires both libcurl4-openssl-dev and

  # libcurl4-gnutls-dev which conflict; ignore the gnutls variant so

  # the openssl variant is used consistently.

  Ignore: libcurl4-gnutls-dev

  # libgdal-dev and several of its deps use libjpeg-dev which is provided

  # by both libjpeg62-turbo-dev and libjpeg-dev; prefer the turbo variant.

  Prefer: libjpeg62-turbo-dev

  %endif


  # Append the distribution codename to the OBS release counter on deb-based

  # repositories so that deb filenames are distinguishable across distro

  # versions (e.g. …_1.0.15-1+2.1.trixie_amd64.deb).  debtransform appends

  # "+<release>" to the version for packages whose debian.dsc carries

  # "Debtransform-Release: 1".

  %if "%_repository" == "Debian_12"

  Release: <CI_CNT>.<B_CNT>.bookworm

  %endif

  %if "%_repository" == "Debian_13"

  Release: <CI_CNT>.<B_CNT>.trixie

  %endif

  %if "%_repository" == "Ubuntu_22.04"

  Release: <CI_CNT>.<B_CNT>.jammy

  %endif

  %if "%_repository" == "Ubuntu_24.04"

  Release: <CI_CNT>.<B_CNT>.noble

  %endif

  %if "%_repository" == "Ubuntu_26.04"

  Release: <CI_CNT>.<B_CNT>.resolute

  %endif


  # Keep the RPM dist tag (e.g. .el9) in the release.  OBS replaces the spec''s

  # Release tag with this pattern, and the default <CI_CNT>.<B_CNT> drops the

  # spec''s dist macro.  First word is the default, further words are per build

  # type: only spec builds get %%{?dist} (escaped so the config parser keeps

  # it for rpmbuild); image/simpleimage builds keep the plain counter, as a

  # literal macro would end up in file names.  The labs RedHat:UBI-N base

  # projects set the same line; repeating it here applies it on every

  # instance and to the RockyLinux repositories.

  %if "%_repository" == "RockyLinux_8" || "%_repository" == "RockyLinux_9" || "%_repository"
  == "RockyLinux_9.6" || "%_repository" == "RockyLinux_10" || "%_repository" == "UBI_8"
  || "%_repository" == "UBI_9" || "%_repository" == "UBI_10"

  Release: <CI_CNT>.<B_CNT> spec:<CI_CNT>.<B_CNT>%%{?dist}

  %endif


  # --- from root/ppg/staging/18/project.yaml ---

  %if "%_repository" == "openSUSE_Tumbleweed" || "%_repository" == "openSUSE_Leap_16"

  # Suppress the previous major''s system package so that this project does not

  # pick it up when both majors are present in the interconnect.

  Ignore: postgresql17-server

  %endif


  %if "%_repository" == "Debian_12" || "%_repository" == "Ubuntu_22.04"

  # PG 18 JIT requires LLVM >= 19; use repackaged llvm-21 from common:deps:build.

  Prefer: llvm-21-dev

  Prefer: clang-21

  Substitute: llvm-dev llvm-21-dev

  Substitute: clang clang-21

  # Force the whole llvm-21 toolchain into every Debian 12 build root. clang-21/

  # llvm-21-dev pull the rest transitively but an inherited Ignore strips them,

  # and extensions (pgvector, postgis) need clang-21 for PGXS bitcode yet only

  # Build-Depend on the server-dev package. Support: beats the Ignore.

  Support: clang-21

  Support: llvm-21-dev

  Support: libllvm21

  Support: libclang-cpp21

  Support: libclang-common-21-dev

  Support: llvm-21-linker-tools

  Support: libclang1-21

  Support: llvm-21

  Support: llvm-21-runtime

  Support: llvm-21-tools

  Support: libc++-21-dev

  Support: libc++abi-21-dev

  Support: libc++1-21

  Support: libc++abi1-21

  %endif


  %if "%_repository" == "Debian_12"

  # Prefer repackaged llvm-21 over Bookworm''s system LLVM 14.

  Ignore: libllvm14

  Ignore: llvm-14-runtime

  Ignore: llvm-14-linker-tools

  Ignore: libclang-cpp14

  Ignore: libclang-common-14-dev

  Ignore: libclang1-14

  Ignore: llvm-14-tools

  Ignore: llvm-14

  Ignore: llvm-14-dev

  Ignore: clang-14

  %endif


  # --- from root/ppg/staging/18/extras/project.yaml ---

  %if "%_repository" == "UBI_9"

  ExpandFlags: module:llvm-toolset-rhel9

  # hdf-libs (EPEL split package) and hdf both provide libdf.so.0 and libmfhdf.so.0

  Prefer: hdf-libs

  %endif

  '
repositories:
- archs:
  - x86_64
  - aarch64
  name: UBI_9
  paths:
  - repository: UBI_9
    subproject: ppg:common:deps
  - repository: UBI_9
    subproject: common:deps:build
  - repository: UBI_9
    subproject: ppg:releases:18
  - project: Fedora:EPEL:9
    repository: standard
  - project: RedHat:UBI-9
    repository: standard
  - project: RockyLinux:9
    repository: devel
title: ppg releases 18 — extras
