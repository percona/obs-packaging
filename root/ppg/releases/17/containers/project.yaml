      percona-pgpool-II=4.7.2

      percona-pgvector=0.8.6

      percona-postgis=3.5.7

      percona-postgresql=17.11.1

      percona-postgresql-common=293

      percona-wal2json=2.6

      proj=9.6.0

      python3-attrs=22.1.0

      python3-blessed=1.22.0

      python3-boto3=1.38.19

      python3-botocore=1.38.19

      python3-click=8.1.7

      python3-dateutil=2.9.0.post0

      python3-dns=2.8.0

      python3-etcd=0.4.5

      python3-jmespath=1.0.1

      python3-kazoo=2.8.0

      python3-lz4=4.3.3

      python3-prettytable=3.4.0

      python3-psutil=6.1.1

      python3-psycopg2=2.9.13

      python3-py-consul=1.6.0

      python3-pysyncobj=0.3.10

      python3-s3transfer=0.12.0

      python3-six=1.17.0

      python3-systemd=235

      python3-wcwidth=0.2.13

      python3-zstandard=0.23.0

      sfcgal=2.3.0

      ydiff=1.4.2'
    REPOSITORY:
      image: percona-distribution-postgresql
      repository: ubi8
    SERVER_VERSION: '17.11'
    TESTING_BRANCH: main
    WITH_POSTGIS:
    - true
    - false
  pipeline: docker-server-parallel
