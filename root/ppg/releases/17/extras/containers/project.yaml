build: false
description: 'Extras:containers subproject for ppg:releases:17.

  Builds are disabled; binaries are copied via osc release.

  '
project-config: '%if "%_repository" == "ubi9"

  Type: docker

  BuildEngine: podman

  BuildFlags: dockerarg:PPG_REPO=staging

  BuildFlags: dockerarg:RHEL_VER=el9


  Preinstall: skopeo


  ExpandFlags: filterbasecontainerpkgs

  Prefer: redhat-release

  Prefer: glibc-minimal-langpack

  Prefer: gpgme

  Prefer: iptables-nft

  Prefer: percona-postgresql17-libs

  Ignore: rocky-release


  Prefer: glibc-minimal-langpack


  BuildFlags: sbom:spdx

  BuildFlags: sbom:cyclonedx

  PublishFlags: withsbom

  %endif

  '
repositories:
- archs:
  - x86_64
  - aarch64
  name: ubi9
  paths:
  - repository: UBI_9
    subproject: ppg:releases:17:extras
  - repository: UBI_9
    subproject: ppg:releases:17
  - repository: UBI_9
    subproject: ppg:staging:16
  - repository: UBI_9
    subproject: ppg:common:deps
  - repository: images
    subproject: common:containers:ubi9
  - repository: UBI_9
    subproject: common:containers:ubi9
  - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
    repository: standard
  - project: ${REMOTE_OBS_ORG_INTERCONNECT}RedHat:UBI-9
    repository: standard
title: ppg releases 17 — extras:containers
