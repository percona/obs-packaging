title: hatchling 1.28.0 for Python 3.12
description: |
  Modern, extensible Python build backend. RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4). Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).

# UBI_9-only: pgAdmin 4 is built only for UBI 9. The build map is a deny-list:
# add every new root repository here as false.
build:
  RockyLinux_8: false
  RockyLinux_9: false
  RockyLinux_9.6: false
  RockyLinux_10: false
  UBI_8: false
  UBI_10: false
  Debian_12: false
  Debian_13: false
  Ubuntu_22.04: false
  Ubuntu_24.04: false
  Ubuntu_26.04: false
  openSUSE_Tumbleweed: false
  openSUSE_Leap_16: false
