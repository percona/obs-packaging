title: PPG Common Dependencies
description: |
  Build-time and runtime packages shared across Percona Distribution for PostgreSQL versions.
publish: false

project-config: |
  # libverto-libev / Lmod settle "have choice" reports for krb5-server and
  # friends in the dependency projects (this one and common:deps:runtime).
  # They used to live in the root project.yaml; the per-major PPG build
  # projects never needed them, so they live only where they are effective.
  %if "%_repository" == "RockyLinux_8" || "%_repository" == "UBI_8"
  Prefer: libverto-libev
  Prefer: Lmod
  # swig is modular on EL8 (streams 3.0/4.0/4.1, none visible without a
  # flag); gdal38 needs it for its Python 3.12 and Java bindings. 4.1 is the
  # stream that knows Python 3.12.
  ExpandFlags: module:swig-4.1
  # gdal38's Java build pulls copy-jdk-configs, which needs lua (have choice: compat-lua lua)
  Prefer: lua
  %endif

  %if "%_repository" == "RockyLinux_9" || "%_repository" == "RockyLinux_9.6"
  # krb5-server needs libverto-module-base, provided by both libverto-libev
  # and libverto-libevent on the 9.6 vault repo set ("have choice", seen on
  # pr-2 ppg:common:deps/krb5). Same pick as the EL8 block above.
  Prefer: libverto-libev
  %endif

  %if "%_repository" == "RockyLinux_9" || "%_repository" == "RockyLinux_9.6" || "%_repository" == "UBI_9"
  # gdal313 (ant + java-17-openjdk-devel, PGDG's EL9 JDK): ant needs an
  # ant-jdk-binding (ant-openjdk8/11/17/21/unbound) and copy-jdk-configs
  # needs lua (lua or compat-lua); OBS reports "have choice" for both.
  Prefer: ant-openjdk17
  Prefer: lua
  %endif

  %if "%_repository" == "RockyLinux_10" || "%_repository" == "UBI_10"
  # gdal313 (ant + java-21-openjdk-devel): ant-jdk-binding "have choice"
  # between ant-openjdk21 and ant-unbound.
  Prefer: ant-openjdk21

  # Our packages carry deliberate RUNPATHs to /usr/<pkg> prefixes (PGDG
  # layout without ld.so.conf.d) and each spec's %install verifies them;
  # EL10's brp-check-rpaths rejects them. Same rule as
  # root/ppg/staging/subprojects.yaml.
  Macros:
  %__brp_check_rpaths %{nil}
  :Macros
  %endif
