title: qhull (RHEL 9 version, UBI_9 only)
description: |
  RHEL 9's qhull 7.2.1-11 rebuilt for UBI_9 and published there only:
  libqhull_r is CRB-only on RHEL 9, UBI 9 lacks CRB, and gdal313-libs needs
  libqhull_r.so.7. Rocky/RHEL users get it from CRB.
