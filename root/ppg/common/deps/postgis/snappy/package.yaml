title: snappy (RHEL 9 version, UBI_9 only)
description: |
  RHEL 9's snappy 1.1.8-8 rebuilt for UBI_9 and published there only: UBI 9
  lacks snappy and libarrow (EPEL 9, pulled by gdal313-libs) needs
  libsnappy.so.1. Rocky/RHEL users get it from the distribution. Separate from
  ppg:common:deps snappy, which is RHEL 10's 1.1.10 for UBI_10 only.
