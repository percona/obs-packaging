title: qt5-qtbase (RHEL 9 version, UBI_9 only)
description: |
  RHEL 9's qt5-qtbase 5.15.9-11.1 rebuilt for UBI_9 and published there only:
  UBI 9 lacks qt5-qtbase and qt5-qtbase-common, and gpsbabel (EPEL 9, pulled
  by gdal313-libs) needs libQt5Core.so.5. Rocky/RHEL users get it from
  the distribution.
