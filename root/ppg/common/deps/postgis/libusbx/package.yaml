title: libusbx (RHEL 9 version, UBI_9 only)
description: |
  RHEL 9's libusbx 1.0.30-1 rebuilt for UBI_9 and published there only:
  UBI 9 lacks libusbx, which gdal313's EPEL 9 dependencies need. Rocky/RHEL
  users get it from the distribution.
