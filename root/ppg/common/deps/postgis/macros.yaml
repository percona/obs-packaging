# ppg:common:deps:postgis builds the PostGIS GIS dependency stack once for
# every PG major.  PG_MAJOR_VERSION is the major whose libpq GDAL links
# against (percona-postgresql<N>-devel) and whose staging project is on the
# repository path.  Bump it by hand in the PR that adds a new GA major to
# root/ppg/staging/ — never derived from the tree, so a new major directory
# cannot silently rebuild the whole GIS stack.
- PG_MAJOR_VERSION: 18
