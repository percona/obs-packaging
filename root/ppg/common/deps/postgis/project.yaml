title: PostGIS dependency stack
description: |
  The PGDG-mirrored GIS libraries percona-postgis builds against (GEOS,
  PROJ, libgeotiff, librttopo, libspatialite, GDAL, SFCGAL). GDAL links
  against the libpq of the pinned PG major (macros.yaml PG_MAJOR_VERSION),
  so this project paths to ppg:staging:<that major>; ppg:common:deps cannot,
  because every ppg:staging:<V> paths to ppg:common:deps (circular).
  Consumed by ppg:staging:<V> only through obs/_aggregate packages
  (root/ppg/staging/_shared/<pkg>/obs/_aggregate), hence never published
  from here.

publish: false

# Repositories, debuginfo flags and the build configuration are inherited
# from root/project.yaml and ../project.yaml.  The only addition is the
# path-prefix below, prepended to every inherited repository: the pinned
# staging major first (percona-postgresql<N>-devel for GDAL), then the
# parent ppg:common:deps (the non-GIS build dependencies), then the
# inherited base paths.
path-prefix:
  - subproject: ppg:staging:%!{PG_MAJOR_VERSION}
    repository: "%_repository"
  - subproject: ppg:common:deps
    repository: "%_repository"

project-config: |
  %if "%_repository" == "RockyLinux_8" || "%_repository" == "UBI_8"
  # swig is modular on EL8 (streams 3.0/4.0/4.1, none visible without a
  # flag); gdal38 needs it for its Python 3.12 and Java bindings. 4.1 is the
  # stream that knows Python 3.12.
  ExpandFlags: module:swig-4.1
  # gdal38's Java build pulls copy-jdk-configs, which needs lua (have choice: compat-lua lua)
  Prefer: lua
  %endif

  %if "%_repository" == "RockyLinux_9" || "%_repository" == "RockyLinux_9.6" || "%_repository" == "UBI_9"
  # gdal313 (ant + java-17-openjdk-devel, PGDG's EL9 JDK): ant needs an
  # ant-jdk-binding (ant-openjdk8/11/17/21/unbound) and copy-jdk-configs
  # needs lua (lua or compat-lua); OBS reports "have choice" for both.
  Prefer: ant-openjdk17
  Prefer: lua
  %endif

  %if "%_repository" == "RockyLinux_10" || "%_repository" == "UBI_10"
  # gdal313 (ant + java-21-openjdk-devel): ant-jdk-binding "have choice"
  # between ant-openjdk21 and ant-unbound.
  Prefer: ant-openjdk21
  %endif
