title: perl-JSON 4.10 for UBI 10
description: |
  RHEL 10's perl-JSON (4.10), rebuilt from the CentOS Stream 10 spec so that
  UBI 10 based containers can install it from the Percona repository (UBI 10
  does not ship it). The unversioned perl-JSON directory carries the RHEL 9
  version for UBI 8/9.

