title: joserfc 1.7.7 for Python 3.12
description: |
  The ultimate Python library for JOSE RFCs, including JWS, JWE, JWK, JWA, JWT. RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4) through python3-authlib. Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).
