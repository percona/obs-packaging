title: pyasn1 0.6.4 for Python 3.12
description: |
  Pure-Python implementation of ASN.1 types and DER/BER/CER codecs (X.208). RPM-only python3.12-* build from the PyPI sdist,
  consumed by pgAdmin 4 (percona-pgadmin4). Bump by editing obs/_service (sdist URL) and
  rpm/*.spec (Version + changelog).
