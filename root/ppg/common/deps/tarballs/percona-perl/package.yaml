title: /opt-prefixed Perl runtime for the PPG binary tarball
description: |
  Perl built from upstream source with every install path compiled to
  /opt/percona-perl, so the RPM-built plperl.so bundled into the Percona
  PostgreSQL binary tarball resolves libperl and its @INC (strict.pm,
  POSIX.pm, ...) with zero environment variables. The version MUST match
  the distro perl of each build base (5.26.3 on EL8, 5.32.1 on EL9):
  plperl.so is ABI-tied to the libperl it was compiled against
  (DT_NEEDED libperl.so.5.26 / libperl.so.5.32). Installs only under
  /opt/percona-perl — nothing shadows system packages. RockyLinux_8,
  RockyLinux_9 and RockyLinux_9.6 only — the tarball build bases
  (ssl1.1 on EL8, ssl3 on the 9.6 vault).

# Builds on every repo of ppg:common:deps:tarballs (one per tarball EL
# base: RockyLinux_8=ssl1.1, RockyLinux_9.6=ssl3, RockyLinux_9=ssl3.5).
