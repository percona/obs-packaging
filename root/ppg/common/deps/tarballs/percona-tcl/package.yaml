title: /opt-prefixed Tcl runtime for the PPG binary tarball
description: |
  Tcl 8.6 built from upstream source with --prefix=/opt/percona-tcl, so
  the compiled-in TCL_LIBRARY default is /opt/percona-tcl/lib/tcl8.6 and
  the RPM-built pltcl.so bundled into the Percona PostgreSQL binary
  tarball initializes its interpreter with zero environment variables.
  One version for both bases: pltcl.so links the unversioned SONAME
  libtcl8.6.so and Tcl is ABI-stable within 8.6 (EL8 ships 8.6.8, EL9
  8.6.10 — we build 8.6.10). Installs only under /opt/percona-tcl —
  nothing shadows system packages. RockyLinux_8, RockyLinux_9 and
  RockyLinux_9.6 only — the tarball build bases (ssl1.1 on EL8, ssl3 on
  the 9.6 vault).

# Builds on every repo of ppg:common:deps:tarballs (one per tarball EL
# base: RockyLinux_8=ssl1.1, RockyLinux_9.6=ssl3, RockyLinux_9=ssl3.5).
