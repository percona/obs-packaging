title: /opt-prefixed lean GDAL runtime for the PPG binary tarball
description: |
  GDAL built from upstream source with the install prefix
  /opt/percona-gdal and only the driver set the official Percona
  PostgreSQL tarball's libgdal links, so the binary tarball carries a
  handful of shared objects instead of the ~70 that EPEL's
  fully-optioned gdal-libs drags in (armadillo/FlexiBLAS — whose ELF
  constructor abort()s on Rocky hosts — poppler, hdf4/hdf5, netcdf,
  OPeNDAP, xerces, libkml, unixODBC, mariadb, cfitsio, ogdi, ...). The
  GDAL data directory is compiled to /opt/percona-gdal/share/gdal and
  PROJ comes from percona-proj, so both resolve their resource files
  with zero environment variables. Built with CMake: GDAL's bundled
  libgeotiff, no libspatialite, GEOS from geos315
  (ppg:common:deps:postgis).

  Version follows the PGDG-mirrored GDAL that the shipped PostGIS RPMs
  link (ppg:common:deps:postgis): RHEL 8 -> GDAL 3.8.5 like gdal38
  (libgdal.so.34), RHEL 9 -> GDAL 3.13.3 like gdal313 (libgdal.so.39).
  That makes it a drop-in replacement for gdal38-libs/gdal313-libs'
  libgdal inside the binary tarball only — the shipped PostGIS RPMs keep
  resolving to gdal38-libs/gdal313-libs on user systems.

  RockyLinux_8, RockyLinux_9.6 and RockyLinux_9 only: these are the
  tarball build bases (ssl1.1 / ssl3 / ssl3.5).

# Builds on every repo of ppg:common:deps:tarballs (one per tarball EL
# base: RockyLinux_8=ssl1.1, RockyLinux_9.6=ssl3, RockyLinux_9=ssl3.5).
