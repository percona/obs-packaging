title: /opt-prefixed PROJ runtime for the PPG binary tarball
description: |
  PROJ built from upstream source with the install prefix
  /opt/percona-proj, so libproj's compiled-in PROJ_DATA default is
  /opt/percona-proj/share/proj and proj.db is found with zero
  environment variables. Version follows the PGDG-mirrored PROJ that
  the shipped PostGIS RPMs link (ppg:common:deps:postgis):
  RHEL 8 -> PROJ 9.6.2 like proj96, RHEL 9 -> PROJ 9.8.1 like proj98,
  both libproj.so.25. That makes it a drop-in replacement for
  proj96/proj98's libproj inside the binary tarball only — the shipped
  PostGIS RPMs keep resolving to proj96/proj98 on user systems.

  This package is the RHEL 9 build (RockyLinux_9.6 / RockyLinux_9,
  tarballs ssl3 / ssl3.5); percona-proj96 is the RHEL 8 one.

build:
  RockyLinux_8: false
