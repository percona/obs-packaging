title: Free-threaded CPython %!{PYFT_MINOR} under /opt/percona-python%!{PYFT_MINOR}t
description: |
  CPython %!{PYFT_VERSION} built with --disable-gil into its own prefix,
  with pip and venv. Runtime for stormweaver. Nothing shadows the distro
  python: no python(abi) provides, no files outside the prefix.
