- GOLANG_VERSION: 1.26.6
- TELEMETRY_AGENT_VERSION: 1.0.15

# Current PostgreSQL minor version of every major, in one place.  Each
# devel/<V> and staging/<V> macros.yaml sets its own PG_MINOR_VERSION from the
# matching entry, and the cross-major upgrade images (staging/containers,
# staging/extras/containers) read several of them at once to build their tags.
# Defined here, above every tier, so the devel and staging chains both see it.
# Bump the minor here, nowhere else; PPG_RELEASE is computed from the resulting
# PG_VERSION and resets on its own.
- PG_14_MINOR_VERSION: 24

- PG_15_MINOR_VERSION: 19

- PG_16_MINOR_VERSION: 15
- PG_16_PERCONA_PATCH_VERSION: 1

- PG_17_MINOR_VERSION: 11
- PG_17_PERCONA_PATCH_VERSION: 1

- PG_18_MINOR_VERSION: 6
- PG_18_PERCONA_PATCH_VERSION: 1

- PG_19_MINOR_VERSION: 0
- PG_19_PERCONA_PATCH_VERSION: 1
