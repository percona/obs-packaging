- GOLANG_VERSION: 1.26.6
- TELEMETRY_AGENT_VERSION: 1.0.15

# Current PostgreSQL minor version of every major, in one place.  Each
# devel/<V> and staging/<V> macros.yaml sets its own PG_MINOR_VERSION from the
# matching entry, and the cross-major upgrade images (staging/containers,
# staging/extras/containers) read several of them at once to build their tags.
# Defined here, above every tier, so the devel and staging chains both see it.
# Bump the minor here, nowhere else; PPG_RELEASE is computed from the resulting
# PG_VERSION and resets on its own.
- PG_14_MINOR_VERSION: 24

- PG_15_MINOR_VERSION: 19

- PG_16_MINOR_VERSION: 15
- PG_16_PERCONA_PATCH_VERSION: 1

- PG_17_MINOR_VERSION: 11
- PG_17_PERCONA_PATCH_VERSION: 1

- PG_18_MINOR_VERSION: 6
- PG_18_PERCONA_PATCH_VERSION: 1

- PG_19_MINOR_VERSION: 0
- PG_19_PERCONA_PATCH_VERSION: 1

# Component (extension / tool) versions shared by every tier that ships them:
# devel/<V>, staging/<V> and their extras subprojects all resolve these through
# this file, so a bump here lands in devel and staging at once.  A tier or major
# that needs a different version overrides the macro in its own macros.yaml.
#
# Some components pin their git checkout through a separate _TAG macro.  The
# derived ones (%!{X_VERSION} references) are expanded where they are declared,
# so a per-major override of the _VERSION must also redefine the matching _TAG,
# or the checkout and the stamped version will disagree.

# Core package versions
- CREDCHECK_VERSION: 5.0
- CREDCHECK_TAG: v%!{CREDCHECK_VERSION}

- HAPROXY_VERSION: 2.8.27
- PATRONI_VERSION: 4.1.5
- PGAUDIT_SET_USER_TAG: REL4_2_0
- PGAUDIT_SET_USER_VERSION: 4.2.0
- PGBACKREST_VERSION: 2.59.2
- PGBADGER_VERSION: 13.2

# Keep _VERSION and _TAG macros in sync for consistency.
- PGBOUNCER_VERSION: 1.26.0
- PGBOUNCER_TAG: pgbouncer_1_26_0

# Keep _VERSION and _TAG macros in sync for consistency.
- PGPOOL_VERSION: 4.7.2
- PGPOOL_TAG: V4_7_2

- PGVECTOR_VERSION: 0.8.6
- PG_CRON_VERSION: 1.6.8
- PG_GATHER_VERSION: 33
- PG_OIDC_VALIDATOR_VERSION: 1.1.0

- PG_REPACK_VERSION: 1.5.3
- PG_REPACK_TAG: ver_%!{PG_REPACK_VERSION}

- PG_STAT_MONITOR_VERSION: 2.4.0
- PG_TDE_VERSION: 2.2.2
- PG_TELEMETRY_VERSION: 1.2.0
- POSTGIS_VERSION: 3.5.7
- POSTGRESQL_COMMON_VERSION: 293
- PSYCOPG2_VERSION: 2.9.13

# Keep _VERSION and _TAG macros in sync for consistency.
- WAL2JSON_VERSION: 2.6
- WAL2JSON_TAG: wal2json_2_6

# Extension (extras) versions
- H3_VERSION: 4.5.0
- H3_PG_VERSION: 4.5.0
- HLL_VERSION: 2.21
- IP4R_VERSION: 2.4.3
- PG_ANONYMIZER_VERSION: 3.1.1
- PG_PARTMAN_VERSION: 5.4.3
- PG_SIMILARITY_VERSION: 1_0
- PG_UNIT_VERSION: 7.10
- PGROUTING_MAJOR_VERSION: 4.0
- PGROUTING_MINOR_VERSION: 1
- PGROUTING_VERSION: %!{PGROUTING_MAJOR_VERSION}.%!{PGROUTING_MINOR_VERSION}
- PGVECTORSCALE_VERSION: 0.9.0
