title: Percona UBI-9 Container Build Helpers
description: |
  Build-time helpers (createrepo_c, umoci) for the UBI-9 based container images, which are built from the official registry.access.redhat.com/ubi9/ubi-minimal image via RedHat:UBI:Registry.

# This project's repository set and build configuration are unrelated to its
# parent's: declare them in full here instead of patching the inherited ones.
repositories-inherit: false
project-config-inherit: false

publish: false
repositories:
  - name: UBI_9
    paths:
      - project: Fedora:EPEL:9
        repository: standard
      - project: RedHat:UBI-9
        repository: standard
      - project: RockyLinux:9
        repository: devel
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "UBI_9"
  Type: spec
  Ignore: kbd-legacy < 2.4.0-11
  %endif
