title: Percona UBI-9 Base Container Images
description: |
  This project contains UBI-9 base container images used by the several Percona distributions.

# This project's repository set and build configuration are unrelated to its
# parent's: declare them in full here instead of patching the inherited ones.
repositories-inherit: false
project-config-inherit: false

publish: false
repositories:
  - name: UBI_9
    paths:
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}Fedora:EPEL:9
        repository: standard
      - project: RedHat:UBI-9
        repository: standard
      - project: ${REMOTE_OBS_ORG_INTERCONNECT}RockyLinux:9
        repository: devel
    archs: [x86_64, aarch64]
  - name: images
    paths:
      - subproject: common:containers:ubi9
        repository: UBI_9
      - project: RedHat:UBI-9
        repository: standard
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "UBI_9"
  Type: spec
  Ignore: kbd-legacy < 2.4.0-11
  %endif

  %if "%_repository" == "images"
  Type: kiwi
  Repotype: none
  Patterntype: none

  ExpandFlags: kiwi-nobasepackages
  Preinstall: filesystem glibc libgcc audit-libs bzip2-libs libacl libattr libarchive libcap libcap-ng lz4-libs libxml2 libzstd lua-libs openssl-libs popt sqlite-libs xz-libs zlib rpm-libs rpm util-linux-user umoci xz
  Ignore: obs-service-kiwi_label_helper:libxslt-tools
  Ignore: python3-kiwi:screen
  Ignore: kiwi-systemdeps-core:mtools

  Prefer: openssl-fips-provider
  Prefer: glibc-minimal-langpack

  BuildFlags: container-compression-format:zstd
  BuildFlags: container-build-format:oci

  %endif
