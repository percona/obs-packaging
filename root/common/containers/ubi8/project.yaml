title: Percona UBI-8 Container Build Helpers
description: |
  Build-time helpers (createrepo_c, umoci, and the EL8 -devel repackages createrepo_c needs) for the UBI-8 based container images, which are built from the official registry.access.redhat.com/ubi8/ubi-minimal image via RedHat:UBI:Registry.

# This project's repository set and build configuration are unrelated to its
# parent's: declare them in full here instead of patching the inherited ones.
repositories-inherit: false
project-config-inherit: false

publish: false
repositories:
  - name: UBI_8
    paths:
      - project: RedHat:UBI-8
        repository: standard
    archs: [x86_64, aarch64]

project-config: |
  %if "%_repository" == "UBI_8"
  Type: spec
  Ignore: kbd-legacy < 2.4.0-11

  ExpandFlags: module:container-tools-rhel8
  ExpandFlags: module:llvm-toolset-rhel8
  ExpandFlags: module:perl-5.26
  ExpandFlags: module:perl-IO-Socket-SSL-2.066
  ExpandFlags: module:perl-libwww-perl-6.34
  ExpandFlags: module:python39-3.9

  Prefer: selinux-policy-targeted

  %endif
