title: LLVM 21 toolchain for Debian 11 and 12
description: |
  LLVM 21 and Clang 21 packages repackaged from apt.llvm.org for Debian 11
  (Bullseye builds) and Debian 12 (Bookworm builds) that require LLVM >= 14
  (e.g. PostgreSQL 18 JIT) or C++23 (e.g. pg_oidc_validator on Bullseye).
  Used by PPG 18 and by tools:stormweaver (C++23 on Debian 12 / Ubuntu 22.04);
  other PPG majors Ignore these packages and use the distro LLVM instead.

