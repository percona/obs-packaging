name: 'OBS Tooling Setup'
description: >
  Link the pre-built venv from the obs-tools container and write osc credentials.
  Must run after actions/checkout so the workspace path is available.
  Requires the job to run inside ghcr.io/<owner>/obs-tools (container:).

inputs:
  obs-apiurl:
    description: 'OBS API URL (e.g. http://my-obs:3000)'
    required: true
  obs-user:
    description: 'OBS username'
    required: true
  obs-password:
    description: 'OBS password'
    required: true

runs:
  using: composite
  steps:
    - name: Link pre-built venv
      shell: bash
      run: |
        ln -s /opt/obs-tools/venv "$GITHUB_WORKSPACE/venv"
        # Prevent osc's git_version.py from finding this repo's git tags when
        # run from inside venv/. Without this, `git describe` returns our
        # release tags (e.g. ppg/17.9-1) which osc cannot parse as its own
        # version string, crashing at import time.
        echo "GIT_CEILING_DIRECTORIES=$GITHUB_WORKSPACE/venv" >> "$GITHUB_ENV"

    # Write ~/.config/osc/oscrc via Python so special characters in the
    # password are handled correctly without any shell quoting concerns.
    - name: Write osc credentials
      shell: bash
      env:
        OBS_APIURL: ${{ inputs.obs-apiurl }}
        OBS_USER: ${{ inputs.obs-user }}
        OBS_PASSWORD: ${{ inputs.obs-password }}
      run: |
        python3 - <<'PYEOF'
        import configparser, os, pathlib
        apiurl = os.environ['OBS_APIURL']
        c = configparser.RawConfigParser()
        c['general'] = {'apiurl': apiurl}
        c[apiurl] = {'user': os.environ['OBS_USER'], 'pass': os.environ['OBS_PASSWORD']}
        p = pathlib.Path.home() / '.config' / 'osc' / 'oscrc'
        p.parent.mkdir(parents=True, exist_ok=True)
        with open(p, 'w') as f:
            c.write(f)
        PYEOF

    # OBS source services (download_url, …) shell out to wget with its
    # defaults: 20 tries with a multi-minute connect timeout each, so a host
    # that refuses the runner's IP (ftp.gnu.org has done this to cloud
    # ranges) burns ~45 min per attempt before the service even reports
    # failure.  Cap it: 3 tries, 30 s to connect, 120 s stalled read.  wget
    # honours $WGETRC; the venv inherits the job env, so every service run
    # by percona-obs picks it up.
    - name: Fail fast on unreachable download hosts
      shell: bash
      run: |
        printf 'tries = 3\nconnect_timeout = 30\nread_timeout = 120\n' > "$RUNNER_TEMP/wgetrc"
        echo "WGETRC=$RUNNER_TEMP/wgetrc" >> "$GITHUB_ENV"
