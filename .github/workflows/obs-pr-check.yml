name: OBS PR Check

# For PRs that touch root/, create a PR-specific OBS project and build
# packages there.  Unchanged packages are aggregated (binary reuse) from the
# main branch's OBS project; only packages changed in this PR are built from
# source.  Posts (or updates) a comment on the PR with the OBS project URL.
#
# Job DAG:
#
#   resolve ──> sync ──┬──> build ───────────────────────────────────────┐
#                      │                                                  │
#                      └──> detect-qa-matrix ──> merge-qa-matrix ─────────┴──> qa  (matrix)
#
# `resolve` fetches PR context from the GitHub API and gates the DAG on the
# presence of a trigger label so that non-trigger events produce no check runs.
# Release-only PRs (all root/ changes under root/*/releases/) reach `sync`
# without a trigger label -- `resolve` also exposes `is_release_pr`, and the
# `sync` job's `if:` opens on either condition, so an unlabeled release PR
# still gets a real `sync release --dry-run` against production.  `build`
# and `qa` stay gated as before (they already skip on is_release_pr).
# `detect-qa-matrix` runs in parallel with `build`; the `qa` matrix combos
# show up in the PR's check list as queued check runs as soon as detect
# finishes, so the upcoming QA work is visible while OBS is still building.
#
# For `labeled` events the `resolve` job runs only when the label that was just
# added is a trigger label (obs-sync, qa-packages, qa-containers).  Control-only
# labels (e.g. no-dep-cascade) and repo-filter labels (e.g. Ubuntu_26.04) fail
# the gate so no workflow run is created and no spurious check runs appear on
# the PR.  Triggering via pull_request (rather than workflow_dispatch) is
# required for the resulting check runs to show in the PR's statusCheckRollup
# and be visible to branch protection.
#
# `sync` and `build` run once per entry of the `OBS_INSTANCES` repository
# variable: each leg targets one OBS instance (its own apiurl, rootprj,
# pr_rootprj, `OBS_PASSWORD_<NAME>` secret and repo/project slice), creates
# its own profiles and PR project, uploads its own artifacts and owns its
# own PR comment (see post_pr_comment.py's per-instance marker).  Repo
# labels only ever narrow an instance's slice, never widen it; a leg left
# with no repository at all skips its sync steps and posts no comment.
# `detect-qa-matrix` is matrixed the same way: each leg discovers the QA
# combos of its own instance's PR project (narrowed by that instance's
# optional `qa_types` field), `merge-qa-matrix` concatenates the shares and
# stamps each combo with the instance that found it, and `qa` fans out over
# the merged list, talking to that instance.

on:
  pull_request:
    branches: [main]
    paths: ['root/**']
    types: [opened, synchronize, reopened, labeled]

# One run per PR at a time.  When a push and label additions fire near-
# simultaneously, or when two trigger labels are added together, the earlier
# runs are cancelled and only the last one proceeds (which sees the full label
# set via the API in the resolve job).
concurrency:
  group: obs-pr-check-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # resolve: fetch PR context from the GitHub API.  Also checks for a trigger
  # label so downstream jobs can gate on has_trigger_label instead of repeating
  # the label condition.
  #
  # The job-level `if` skips the entire run for `labeled` events on non-trigger
  # labels (control-only labels, repo-filter labels).  When the condition is
  # false GitHub does not create the workflow run, so no check runs appear on
  # the PR for those label additions.
  # ──────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve PR context
    if: |
      github.event.action != 'labeled' ||
      github.event.label.name == 'obs-sync' ||
      github.event.label.name == 'qa-packages' ||
      github.event.label.name == 'qa-containers'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_number:        ${{ steps.ctx.outputs.pr_number }}
      head_sha:         ${{ steps.ctx.outputs.head_sha }}
      clone_url:        ${{ steps.ctx.outputs.clone_url }}
      labels_json:      ${{ steps.ctx.outputs.labels_json }}
      has_trigger_label: ${{ steps.ctx.outputs.has_trigger_label }}
      is_release_pr:    ${{ steps.release.outputs.is_release_pr }}
    steps:
      - name: Fetch PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.number }}"
          DATA=$(gh api repos/${{ github.repository }}/pulls/${PR})
          HEAD_SHA=$(echo "$DATA" | jq -r '.head.sha')
          CLONE_URL=$(echo "$DATA" | jq -r '.head.repo.clone_url')
          LABELS=$(echo "$DATA" | jq -c '[.labels[].name]')
          HAS_TRIGGER=$(echo "$LABELS" | jq '[.[] | select(. == "obs-sync" or . == "qa-packages" or . == "qa-containers")] | length > 0')
          {
            echo "pr_number=${PR}"
            echo "head_sha=${HEAD_SHA}"
            echo "clone_url=${CLONE_URL}"
            printf 'labels_json=%s\n' "${LABELS}"
            echo "has_trigger_label=${HAS_TRIGGER}"
          } >> "$GITHUB_OUTPUT"

      # Release-only PRs (all root/ changes under root/*/releases/) reach the
      # sync job's release dry-run even without a trigger label -- see the
      # sync job's `if:` below.  Computed independently of has_trigger_label
      # so a release PR with no label still gets the DAG gate opened.
      - name: Detect release-only PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # -R is required: this job runs without a checkout, so gh cannot
          # infer the repository from a local git directory.
          ALL_ROOT=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json files \
            --jq '[.files[] | select(.path | startswith("root/")) | .path] | length')
          REL_ROOT=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json files \
            --jq '[.files[] | select(.path | test("^root/[^/]+/releases/")) | .path] | length')
          if [ "$ALL_ROOT" -gt 0 ] && [ "$ALL_ROOT" -eq "$REL_ROOT" ]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # sync: push the PR contents to OBS and (for release-only PRs) test the
  # release flow.  Does NOT poll OBS builds — that is done in `build` so it
  # can run in parallel with QA matrix detection.
  # ──────────────────────────────────────────────────────────────────────────
  sync:
    name: Sync packages to OBS (${{ matrix.instance.name }})
    needs: [resolve]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.OBS_INSTANCES) }}
    # Backstop for stalled source services / OBS API hangs; a healthy sync
    # job finishes in well under 30 minutes.
    timeout-minutes: 120
    if: needs.resolve.outputs.has_trigger_label == 'true' || needs.resolve.outputs.is_release_pr == 'true'
    permissions:
      # Required to post/update the PR comment.
      pull-requests: write
      packages: read

    # Matrix job outputs are last-writer-wins, so only a value identical
    # across every leg may be exposed here: is_release_pr is derived from
    # the PR diff alone.  Per-leg sync success is NOT an output -- downstream
    # jobs use the aggregate needs.sync.result instead.
    outputs:
      is_release_pr: ${{ steps.detect.outputs.is_release_pr }}

    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      OBS_APIURL: ${{ matrix.instance.apiurl }}
      # The comment link host is still the legacy single-instance web URL;
      # per-instance web URLs are a QA/UI follow-up.
      OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
      OBS_ROOTPRJ: ${{ matrix.instance.rootprj }}
      OBS_PR_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}
      OBS_INSTANCE: ${{ matrix.instance.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: --branch-from runs git log <sha>..HEAD
          # per package to detect which packages changed since main's last sync.
          fetch-depth: 0

      # Packages synced before the migration to percona/obs-packaging carry
      # OBS sync comments whose SHAs come from the legacy repo's history and
      # do not resolve in this clone, which forces the branch decision off
      # the cheap git gate into a full content check for every such package.
      # Fetch the legacy history so those SHAs resolve; drop this step once
      # all packages have been re-synced with percona/obs-packaging SHAs.
      - name: Fetch legacy repo history (pre-migration sync SHAs)
        run: |
          git fetch https://github.com/rjd15372/percona-obs-packaging.git \
            'refs/heads/*:refs/remotes/legacy/*' \
            || echo "::warning::legacy repo unreachable; sync falls back to content checks"

      # Persists the content-addressed .cache/ tree across runs, split in
      # two entries (same layout as sync-main.yml so PR runs can restore the
      # main branch's caches via restore-keys):
      #
      #   deps — download_url, cargo_vendor and Phase 2 manual-service
      #          outputs (crates, go tarballs, vendor tarballs): small and
      #          stable across commits.
      #   scm  — Phase 1 obs_scm outputs: multi-GB source archives keyed by
      #          upstream HEAD, churning on every upstream advance.
      #
      # Splitting keeps the small, highly-reusable deps cache from being
      # evicted out of the repo's 10 GB Actions cache quota by churn in the
      # much larger scm tree.  The caches are keyed by the PR head commit so
      # re-running the workflow on the same commit is a full hit and Phase
      # 1/2 services are skipped entirely -- otherwise each fresh checkout
      # would regenerate vendor tarballs with new file mtimes, producing
      # different MD5s and needless re-uploads.  Entries are content-
      # addressed so a partial hit via restore-keys is always safe: unused
      # SHA-keyed subdirs are ignored.
      # The deps `path` list MUST stay identical to the one in sync-main.yml:
      # actions/cache hashes the path list into the cache *version*, and
      # restore-keys only match entries with the same version.  A divergence
      # silently hides main's deps cache from PR runs, which then re-download
      # every download_url source (and re-vendor every crate) on every run.
      - name: Restore percona-obs deps cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/download_url
            .cache/cargo_vendor
            .cache/services
            .cache/sync_state
          key: percona-obs-deps-${{ runner.os }}-${{ needs.resolve.outputs.head_sha }}
          restore-keys: |
            percona-obs-deps-${{ runner.os }}-

      - name: Restore percona-obs scm cache
        uses: actions/cache@v4
        with:
          path: .cache/obs_scm
          key: percona-obs-scm-${{ runner.os }}-${{ needs.resolve.outputs.head_sha }}
          restore-keys: |
            percona-obs-scm-${{ runner.os }}-

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance.apiurl }}
          obs-user: ${{ matrix.instance.user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance.name)] }}

      # Two profiles are needed:
      #
      #   main    — points at the main branch's OBS project; used as the
      #             --branch-from source so percona-obs can read each package's
      #             last-sync SHA and decide aggregate vs. promote.
      #
      #   pr-N    — points at the PR-specific OBS project (rootprj:pr-N);
      #             packages changed in this PR are synced here from source,
      #             unchanged packages get an _aggregate pointing at main.
      #
      # PERCONA_OBS_PACKAGING_BRANCH for the PR profile is set to
      # refs/pull/<N>/head — a GitHub pseudo-ref accessible via git ls-remote
      # for all PRs including forks.  OBS's obs_scm service uses this ref to
      # check out the PR's packaging files when it builds promoted packages.
      # Repo labels narrow this instance's slice (never widen it): each label
      # is a repository name; <flavor>-images expands to <flavor>,UBI_<n>,images
      # (the base-image projects under common/containers declare a repository
      # literally named "images") and
      # excludes the other flavor's base-image project; ssl* keeps tarballs
      # building whenever any repo label is present.  A leg whose narrowed
      # slice is empty (profile create exits 3) has nothing to build here.
      - name: Create percona-obs profiles (${{ matrix.instance.name }})
        id: profiles
        shell: bash
        env:
          LABELS_JSON: ${{ needs.resolve.outputs.labels_json }}
          INCLUDE_REPOS: ${{ matrix.instance.include_repos }}
          EXCLUDE_REPOS: ${{ matrix.instance.exclude_repos }}
          INCLUDE_PROJECTS: ${{ matrix.instance.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.instance.exclude_projects }}
          CLONE_URL: ${{ needs.resolve.outputs.clone_url }}
          MAIN_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          INSTANCE_ENV: ${{ toJSON(matrix.instance.env) }}
        run: |
          set -euo pipefail
          # Per-instance env from the OBS_INSTANCES entry, appended after the
          # defaults so an instance can override them (parse_env_overrides is
          # last-wins and splits KEY:VALUE on the first colon, so a value such
          # as "openSUSE.org:" survives intact).
          env_args=()
          if [ -n "${INSTANCE_ENV:-}" ] && [ "$INSTANCE_ENV" != "null" ]; then
            while IFS= read -r kv; do
              # `if`, not `[ … ] &&`: with an empty env object the test fails on
              # the last line and, as the loop body's final command, would make
              # the loop exit non-zero and trip `set -e`.
              if [ -n "$kv" ]; then env_args+=(-e "$kv"); fi
            done <<<"$(jq -r 'to_entries[] | "\(.key):\(.value)"' <<<"$INSTANCE_ENV")"
          fi

          inst=()
          if [ -n "${INCLUDE_REPOS:-}" ]; then inst+=(--include-repos "$INCLUDE_REPOS"); fi
          if [ -n "${EXCLUDE_REPOS:-}" ]; then inst+=(--exclude-repos "$EXCLUDE_REPOS"); fi
          if [ -n "${INCLUDE_PROJECTS:-}" ]; then inst+=(--include-projects "$INCLUDE_PROJECTS"); fi
          if [ -n "${EXCLUDE_PROJECTS:-}" ]; then inst+=(--exclude-projects "$EXCLUDE_PROJECTS"); fi

          CONTROL='. != "obs-sync" and . != "qa-packages" and . != "qa-containers" and . != "no-dep-cascade"'
          mapfile -t REPO_LABELS < <(echo "$LABELS_JSON" | jq -r ".[] | select(${CONTROL})")
          narrow=(); flavors=(); labels=()
          for l in "${REPO_LABELS[@]}"; do
            case "$l" in
              *-images) f="${l%-images}"; flavors+=("$f"); narrow+=("$f" "UBI_${f#ubi}" images) ;;
              *)        narrow+=("$l") ;;
            esac
          done
          if [ ${#REPO_LABELS[@]} -gt 0 ]; then
            narrow+=("ssl*")
            labels+=(--narrow-repos "$(IFS=,; echo "${narrow[*]}")")
            if [ ${#flavors[@]} -gt 0 ]; then
              for other in ubi8 ubi9; do
                if ! printf '%s\n' "${flavors[@]}" | grep -qx "$other"; then
                  labels+=(--exclude-projects "common:containers:${other}")
                fi
              done
            fi
          fi
          if echo "$LABELS_JSON" | jq -e '[.[] | select(. == "no-dep-cascade")] | length > 0' > /dev/null; then
            echo "no_dep_cascade_arg=--no-dep-cascade" >> "$GITHUB_OUTPUT"
          fi

          venv/bin/python -m percona_obs -A "$OBS_APIURL" -R "$OBS_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${MAIN_REPO_URL}" "${env_args[@]}" \
            profile create main "${inst[@]}"

          PR_ROOTPRJ="${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}"
          set +e
          venv/bin/python -m percona_obs -A "$OBS_APIURL" -R "$PR_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" -e "PERCONA_OBS_PACKAGING_BRANCH:refs/pull/${PR_NUMBER}/head" \
            -e "PERCONA_OBS_PACKAGING_REPO:${CLONE_URL}" "${env_args[@]}" \
            profile create "pr-${PR_NUMBER}" "${inst[@]}" "${labels[@]}"
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "::notice::instance ${{ matrix.instance.name }}: no repository of this slice is selected by the PR labels; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != "0" ]; then
            exit "$rc"
          fi

      # Detect whether this is a release-only PR (all changed files under
      # root/ are under root/*/releases/).  Release-only PRs skip the package
      # sync steps entirely — releases/ is excluded from sync push traversal
      # so there is nothing to build.
      - name: Detect release-only PR
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'root/**')
          NON_RELEASE=$(echo "$CHANGED" | grep -v '^root/[^/]*/releases/' || true)
          if [ -z "$CHANGED" ] || [ -n "$NON_RELEASE" ]; then
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
          fi

      # Release PRs are validated against the PRODUCTION rootprj: the dry-run
      # reads staging state and the release tree; it writes nothing.
      - name: Create main profile (release dry-run)
        if: steps.detect.outputs.is_release_pr == 'true'
        shell: bash
        env:
          INCLUDE_REPOS: ${{ matrix.instance.include_repos }}
          EXCLUDE_REPOS: ${{ matrix.instance.exclude_repos }}
          INCLUDE_PROJECTS: ${{ matrix.instance.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.instance.exclude_projects }}
          MAIN_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          INSTANCE_ENV: ${{ toJSON(matrix.instance.env) }}
        run: |
          set -euo pipefail
          inst=()
          if [ -n "${INCLUDE_REPOS:-}" ]; then inst+=(--include-repos "$INCLUDE_REPOS"); fi
          if [ -n "${EXCLUDE_REPOS:-}" ]; then inst+=(--exclude-repos "$EXCLUDE_REPOS"); fi
          if [ -n "${INCLUDE_PROJECTS:-}" ]; then inst+=(--include-projects "$INCLUDE_PROJECTS"); fi
          if [ -n "${EXCLUDE_PROJECTS:-}" ]; then inst+=(--exclude-projects "$EXCLUDE_PROJECTS"); fi
          env_args=()
          if [ -n "${INSTANCE_ENV:-}" ] && [ "$INSTANCE_ENV" != "null" ]; then
            while IFS= read -r kv; do
              # `if`, not `[ … ] &&`: with an empty env object the test fails on
              # the last line and, as the loop body's final command, would make
              # the loop exit non-zero and trip `set -e`.
              if [ -n "$kv" ]; then env_args+=(-e "$kv"); fi
            done <<<"$(jq -r 'to_entries[] | "\(.key):\(.value)"' <<<"$INSTANCE_ENV")"
          fi
          venv/bin/python -m percona_obs -A "$OBS_APIURL" -R "$OBS_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${MAIN_REPO_URL}" "${env_args[@]}" \
            profile create main "${inst[@]}"

      - name: Release dry-run
        id: release-dryrun
        if: steps.detect.outputs.is_release_pr == 'true'
        # Container-job steps default to plain `sh`, which rejects
        # `set -o pipefail`; this script is bash.
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'root/*/releases/*/release.yaml')
          [ -z "$CHANGED" ] && { echo "::error::release PR changes no release.yaml"; exit 1; }
          for release_file in $CHANGED; do
            proj=$(dirname "${release_file#root/}" | tr '/' ':')
            echo "== sync release ${proj} --dry-run"
            venv/bin/python -m percona_obs -P main sync release "$proj" --dry-run
          done

      # Dry run: shows the sync plan (which packages will be promoted vs
      # aggregated) before the real sync starts, making progress visible early.
      # A failure here aborts the workflow before the real sync runs.
      - name: Plan sync (dry run)
        if: steps.detect.outputs.is_release_pr != 'true' && steps.profiles.outputs.skip != 'true'
        run: |
          venv/bin/python -u -m percona_obs \
            -P "pr-${PR_NUMBER}" sync push \
            --dry-run \
            --branch-from main \
            --no-scm-validate \
            ${{ steps.profiles.outputs.no_dep_cascade_arg }}

      # -u disables Python stdout buffering so progress lines appear
      # immediately even though output is piped through tee.
      # Output is tee'd to a file so the comment step can parse package counts.
      - name: Sync PR to OBS
        id: sync
        if: steps.detect.outputs.is_release_pr != 'true' && steps.profiles.outputs.skip != 'true'
        run: |
          venv/bin/python -u -m percona_obs --verbose \
            -P "pr-${PR_NUMBER}" sync push \
            --branch-from main \
            --no-scm-validate \
            ${{ steps.profiles.outputs.no_dep_cascade_arg }} \
            | tee /tmp/sync-output.txt

      # Drop cache entries not used by any run in the last 7 days so the
      # .cache/ tree saved by actions/cache stops growing monotonically.
      # Entry mtimes are bumped on every cache hit, so age == unused-for.
      # Runs even when the sync fails: pruning only removes stale entries.
      - name: Prune stale cache entries
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/prune_obs_cache.py

      # The full build-status comment is posted by the `build` job (which has
      # the poll details).  This step only fires for the two terminal-in-sync
      # cases: release-only PRs and sync failures.  For successful non-release
      # PRs it is skipped — `build` will post the real comment.
      # A leg whose slice the labels narrowed to nothing posts no comment at
      # all: it has nothing to report.  Each instance owns its own comment
      # (post_pr_comment.py keys on OBS_INSTANCE).
      - name: Post OBS project comment (sync-side)
        if: always() && steps.profiles.outputs.skip != 'true' && (steps.detect.outputs.is_release_pr == 'true' || steps.sync.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RELEASE_PR: ${{ steps.detect.outputs.is_release_pr }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          RELEASE_OUTCOME: ${{ steps.release-dryrun.outcome }}
          POLL_OUTCOME: ''
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OBS_INSTANCE: ${{ matrix.instance.name }}
          OBS_ROOTPRJ: ${{ matrix.instance.rootprj }}
          OBS_PR_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}
        run: python .github/scripts/post_pr_comment.py

      # Upload the sync output so the `build` job can read it for the comment.
      # Only meaningful when the sync step actually ran and succeeded.
      - name: Upload sync output
        if: steps.sync.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sync-output-${{ matrix.instance.name }}
          path: /tmp/sync-output.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # build: poll OBS for build completion and post the build-status PR
  # comment.  Runs in parallel with `detect-qa-matrix`.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Wait for OBS builds (${{ matrix.instance.name }})
    needs: [resolve, sync]
    # needs.sync.result is the aggregate over all instance legs: a leg that
    # narrowed to nothing still counts as success, but one FAILED leg blocks
    # the build job for every instance.  Accepted trade-off -- a per-leg gate
    # would need per-instance job outputs, which a matrix job cannot express.
    if: needs.sync.outputs.is_release_pr != 'true' && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.OBS_INSTANCES) }}
    permissions:
      pull-requests: write
      packages: read

    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      OBS_APIURL: ${{ matrix.instance.apiurl }}
      # The comment link host is still the legacy single-instance web URL;
      # per-instance web URLs are a QA/UI follow-up.
      OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
      OBS_PR_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}
      OBS_INSTANCE: ${{ matrix.instance.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance.apiurl }}
          obs-user: ${{ matrix.instance.user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance.name)] }}

      # continue-on-error: a leg whose slice the PR labels narrowed to
      # nothing never ran (let alone uploaded) a sync, so its artifact does
      # not exist.  The download outcome is therefore this job's skip
      # signal: a failed download means "that instance had nothing to do",
      # and the steps below are gated on it so the leg neither polls a
      # non-existent PR project nor posts a spurious failure comment.
      - name: Download sync output
        id: sync-output
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sync-output-${{ matrix.instance.name }}
          path: /tmp

      # Poll OBS until all builds in the PR project reach a terminal state.
      # Fails the job (and PR check) if any build fails, is broken, or is
      # unresolvable.  OBS_REPO_FILTER restricts polling to this instance's
      # slice (the poll script reads the filter keys and ignores the rest).
      - name: Poll OBS build status
        id: poll
        if: steps.sync-output.outcome == 'success'
        env:
          OBS_APIURL: ${{ matrix.instance.apiurl }}
          OBS_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}:pr-${{ needs.resolve.outputs.pr_number }}
          OBS_REPO_FILTER: ${{ toJSON(matrix.instance) }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/poll_obs_builds.py

      # Always runs so the comment is updated even when poll fails -- but
      # only for a leg that actually synced (see the download step above).
      # Each instance owns its own comment (post_pr_comment.py keys on
      # OBS_INSTANCE).
      - name: Post OBS project comment
        if: always() && steps.sync-output.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RELEASE_PR: 'false'
          SYNC_OUTCOME: 'success'
          RELEASE_OUTCOME: ''
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OBS_INSTANCE: ${{ matrix.instance.name }}
          OBS_ROOTPRJ: ${{ matrix.instance.rootprj }}
          OBS_PR_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}
        run: python .github/scripts/post_pr_comment.py

  # ──────────────────────────────────────────────────────────────────────────
  # detect-qa-matrix: discover QA-enabled OBS subprojects, once per entry of
  # the `OBS_INSTANCES` repository variable.  Each leg scans only its own
  # instance's PR project and uploads its share of the matrix as an artifact;
  # `merge-qa-matrix` concatenates them.  Runs in parallel with `build`; once
  # the merge finishes, the `qa` matrix job's check runs appear in the PR's
  # check list as queued, signalling the upcoming QA work.
  #
  # An instance may carry `qa_types` (a comma-separated subset of
  # packages,containers) to declare which QA kinds live on it; the label-
  # derived type list is intersected with it, and an empty intersection means
  # this leg discovers nothing.
  # ──────────────────────────────────────────────────────────────────────────
  detect-qa-matrix:
    name: Detect QA matrix (${{ matrix.instance.name }})
    needs: [resolve, sync]
    # needs.sync.result: the aggregate over all instance legs -- per-leg sync
    # success cannot be a job output (matrix outputs are last-writer-wins).
    if: |
      needs.sync.outputs.is_release_pr != 'true' && needs.sync.result == 'success' &&
      (contains(fromJSON(needs.resolve.outputs.labels_json), 'qa-packages') || contains(fromJSON(needs.resolve.outputs.labels_json), 'qa-containers'))
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.OBS_INSTANCES) }}
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance.apiurl }}
          obs-user: ${{ matrix.instance.user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance.name)] }}

      - name: Write CI profile
        shell: bash
        env:
          OBS_APIURL: ${{ matrix.instance.apiurl }}
          OBS_PR_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}
          OBS_REGISTRY: ${{ matrix.instance.registry }}
          INSTANCE_ENV: ${{ toJSON(matrix.instance.env) }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}
          ${OBS_REGISTRY:+registry: ${OBS_REGISTRY}}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: ''
          EOF
          # Instance env last: profile entries are read in order and the last
          # value for a key wins, so an instance overrides the default above.
          if [ -n "${INSTANCE_ENV:-}" ] && [ "$INSTANCE_ENV" != "null" ]; then
            jq -r 'to_entries[] | "  - name: \(.key)\n    value: '"'"'\(.value)'"'"'"' \
              <<<"$INSTANCE_ENV" >> .profile/ci.yaml
          fi

      # Build QA_TYPES from the qa-packages / qa-containers labels, then
      # intersect with this instance's declared `qa_types` (when non-empty).
      # An empty intersection means this instance hosts none of the requested
      # QA kinds, so its discovery is skipped entirely.
      - name: Resolve QA type filter
        id: qa-types
        env:
          LABELS_JSON: ${{ needs.resolve.outputs.labels_json }}
          INSTANCE_NAME: ${{ matrix.instance.name }}
          INSTANCE_QA_TYPES: ${{ matrix.instance.qa_types }}
        run: |
          set -eu
          TYPES=""
          if echo "$LABELS_JSON" | jq -e '[.[] | select(. == "qa-packages")] | length > 0' > /dev/null; then
            TYPES="packages"
          fi
          if echo "$LABELS_JSON" | jq -e '[.[] | select(. == "qa-containers")] | length > 0' > /dev/null; then
            TYPES="${TYPES:+$TYPES,}containers"
          fi
          if [ -n "${INSTANCE_QA_TYPES:-}" ]; then
            KEPT=""
            for t in $(echo "$TYPES" | tr ',' ' '); do
              for a in $(echo "$INSTANCE_QA_TYPES" | tr ',' ' '); do
                if [ "$t" = "$a" ]; then KEPT="${KEPT:+$KEPT,}$t"; fi
              done
            done
            TYPES="$KEPT"
            if [ -z "$TYPES" ]; then
              echo "::notice::instance ${INSTANCE_NAME}: no requested QA type is hosted here; skipping discovery"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "qa_types=${TYPES}" >> "$GITHUB_OUTPUT"

      # Iterate every immediate subproject of this instance's PR OBS root
      # project, call `percona-obs qa show <project> --json` for each, and
      # concatenate the results into this leg's share of the matrix.
      - name: Discover QA matrix from OBS PR subprojects
        id: matrix
        env:
          OBS_APIURL: ${{ matrix.instance.apiurl }}
          OBS_PROJECT: ${{ matrix.instance.pr_rootprj }}:pr-${{ needs.resolve.outputs.pr_number }}
          PYTHONPATH: ${{ github.workspace }}
          QA_TYPES: ${{ steps.qa-types.outputs.qa_types }}
          SKIP: ${{ steps.qa-types.outputs.skip }}
        run: |
          set -eu
          if [ "${SKIP:-}" = "true" ]; then
            echo '[]' > /tmp/qa-matrix.json
          else
            venv/bin/python .github/scripts/list_qa_matrix.py > /tmp/qa-matrix.json
          fi

      - name: Upload QA matrix share
        uses: actions/upload-artifact@v4
        with:
          name: qa-matrix-${{ matrix.instance.name }}
          path: /tmp/qa-matrix.json
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # merge-qa-matrix: concatenate the per-instance matrix shares into the one
  # matrix the `qa` job fans out over, stamping every entry with flat scalar
  # fields naming the instance it came from (instance_name, instance_apiurl,
  # instance_pr_rootprj, instance_registry).  Flat scalars, not a nested
  # object, so `matrix.include` access stays unambiguous.
  # ──────────────────────────────────────────────────────────────────────────
  merge-qa-matrix:
    name: Merge QA matrix
    needs: [resolve, sync, detect-qa-matrix]
    if: |
      needs.sync.outputs.is_release_pr != 'true' && needs.sync.result == 'success' &&
      needs.detect-qa-matrix.result == 'success' &&
      (contains(fromJSON(needs.resolve.outputs.labels_json), 'qa-packages') || contains(fromJSON(needs.resolve.outputs.labels_json), 'qa-containers'))
    runs-on: ubuntu-latest

    outputs:
      has_matrix: ${{ steps.merge.outputs.has_matrix }}
      matrix: ${{ steps.merge.outputs.matrix }}

    steps:
      - name: Download QA matrix shares
        uses: actions/download-artifact@v4
        with:
          pattern: qa-matrix-*
          path: /tmp/qa-shares

      # Each share lands in /tmp/qa-shares/qa-matrix-<name>/qa-matrix.json, so
      # the instance name comes from the directory name and is looked up in
      # OBS_INSTANCES for the remaining fields.  Shares are merged in
      # OBS_INSTANCES order, which is also the precedence order used to settle
      # duplicates below.
      - name: Merge shares
        id: merge
        env:
          OBS_INSTANCES: ${{ vars.OBS_INSTANCES }}
        run: |
          set -euo pipefail
          names=$(jq -r '.[].name' <<<"$OBS_INSTANCES")
          if [ -z "$names" ]; then
            echo "::error::OBS_INSTANCES is empty or malformed; QA shares cannot be attributed"
            exit 1
          fi
          MATRIX='[]'
          consumed=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            d="/tmp/qa-shares/qa-matrix-${name}"
            [ -d "$d" ] || continue
            consumed=$((consumed + 1))
            inst=$(jq -c --arg n "$name" '.[] | select(.name == $n)' <<<"$OBS_INSTANCES")
            share=$(jq -c --argjson i "$inst" '
              map(. + {
                  instance_name: $i.name,
                  instance_apiurl: $i.apiurl,
                  instance_pr_rootprj: $i.pr_rootprj,
                  instance_user: ($i.user // ""),
                  instance_registry: ($i.registry // ""),
                  instance_env: (($i.env // {}) | tojson)
                })' "$d/qa-matrix.json")
            MATRIX=$(jq -c -n --argjson a "$MATRIX" --argjson b "$share" '$a + $b')
          done <<<"$names"
          # A share that matches no instance would vanish silently, taking that
          # instance's whole QA lane with it (e.g. a rename between the detect
          # and merge jobs), so account for every uploaded share.
          uploaded=$(find /tmp/qa-shares -mindepth 1 -maxdepth 1 -type d -name 'qa-matrix-*' | wc -l)
          if [ "$consumed" -ne "$uploaded" ]; then
            echo "::error::${uploaded} QA share(s) uploaded but ${consumed} matched an OBS_INSTANCES entry"
            exit 1
          fi
          # status_context becomes the check-run name, so two entries sharing
          # one would fight over a single check run.  A project can legitimately
          # be in slice on more than one instance (ppg:staging:16:tde keeps UBI
          # repos on labs and distro repos on b.o.o), and qa_types cannot split
          # those — both classify as the same QA kind.  Settle it by instance
          # order instead of failing: the first instance in OBS_INSTANCES that
          # discovered the context keeps it, and the drop is reported.
          DUPES=$(jq -r '
            group_by(.status_context) | map(select(length > 1)
            | "\(.[0].status_context) (kept on \(.[0].instance_name), dropped on \([.[1:][].instance_name] | join(", ")))")
            | join("; ")' <<<"$MATRIX")
          if [ -n "$DUPES" ]; then
            echo "::warning::QA context discovered on several instances: ${DUPES}"
            MATRIX=$(jq -c 'group_by(.status_context) | map(.[0])' <<<"$MATRIX")
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "${MATRIX}" | jq 'length')" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # qa: trigger and poll Jenkins, once per matrix combo (in parallel).  Each
  # combo carries the instance_* fields stamped in by `merge-qa-matrix`, so a
  # combo talks to the OBS instance that discovered it.
  # ──────────────────────────────────────────────────────────────────────────
  qa:
    name: ${{ matrix.status_context }}
    needs: [resolve, build, merge-qa-matrix]
    if: needs.merge-qa-matrix.outputs.has_matrix == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    permissions:
      packages: read

    strategy:
      matrix:
        include: ${{ fromJSON(needs.merge-qa-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance_apiurl }}
          obs-user: ${{ matrix.instance_user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance_name)] }}

      # Same CI profile as the detect job so `qa run` re-resolves project.yaml
      # parameters identically (same OBS_ROOTPRJ → same ${OBS_ROOTPRJ_SLASHES},
      # same registry → same ${OBS_CONTAINER_REGISTRY}).
      - name: Write CI profile
        shell: bash
        env:
          OBS_APIURL: ${{ matrix.instance_apiurl }}
          OBS_PR_ROOTPRJ: ${{ matrix.instance_pr_rootprj }}
          OBS_REGISTRY: ${{ matrix.instance_registry }}
          INSTANCE_ENV: ${{ matrix.instance_env }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}
          ${OBS_REGISTRY:+registry: ${OBS_REGISTRY}}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: ''
          EOF
          # Instance env last: profile entries are read in order and the last
          # value for a key wins, so an instance overrides the default above.
          if [ -n "${INSTANCE_ENV:-}" ] && [ "$INSTANCE_ENV" != "null" ]; then
            jq -r 'to_entries[] | "  - name: \(.key)\n    value: '"'"'\(.value)'"'"'"' \
              <<<"$INSTANCE_ENV" >> .profile/ci.yaml
          fi

      - name: Run qa pipeline
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          venv/bin/python -m percona_obs -P ci qa run "${{ matrix.project }}" \
            --pipeline "${{ matrix.pipeline }}" \
            --wait \
            --report-json /tmp/qa-report.json \
            ${{ matrix.name_filter }} \
            ${{ matrix.axis_filters }}
