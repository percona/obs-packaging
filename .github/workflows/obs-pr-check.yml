name: OBS PR Check

# For PRs that touch root/, create a PR-specific OBS project and build
# packages there.  Unchanged packages are aggregated (binary reuse) from the
# main branch's OBS project; only packages changed in this PR are built from
# source.  Posts (or updates) a comment on the PR with the OBS project URL.
#
# Job DAG:
#
#   sync ──┬──> build ─────────────────────────┐
#          │                                    │
#          ├──> detect-qa-matrix ───────────────┴──> qa  (matrix)
#          │                       │
#          └──> (qa-cleanup) <─────┘  on build failure only
#
# `detect-qa-matrix` runs in parallel with `build` and posts pending QA
# commit statuses as soon as the matrix is known, so the PR shows the
# upcoming QA jobs while OBS is still building packages.

on:
  pull_request:
    branches: [main]
    paths: ['root/**']
    types: [opened, synchronize, reopened]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # sync: push the PR contents to OBS and (for release-only PRs) test the
  # release flow.  Does NOT poll OBS builds — that is done in `build` so it
  # can run in parallel with QA matrix detection.
  # ──────────────────────────────────────────────────────────────────────────
  sync:
    name: Build packages in OBS
    runs-on: ubuntu-latest
    permissions:
      # Required to post/update the PR comment.
      pull-requests: write
      # Required to post the "OBS Build" commit status on the PR head commit
      # (release-only PR path).
      statuses: write

    outputs:
      is_release_pr: ${{ steps.detect.outputs.is_release_pr }}
      sync_outcome: ${{ steps.sync.outcome }}
      release_outcome: ${{ steps.release.outcome }}

    env:
      PR_NUMBER: ${{ github.event.number }}
      OBS_APIURL: ${{ vars.OBS_APIURL }}
      OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
      OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
      OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: --branch-from runs git log <sha>..HEAD
          # per package to detect which packages changed since main's last sync.
          fetch-depth: 0

      # Persists the content-addressed .cache/ tree (Phase 1 obs_scm outputs
      # and Phase 2 manual-service outputs such as go_modules vendor tarballs)
      # across runs.  The cache is keyed by the PR head commit so re-running
      # the workflow on the same commit is a full hit and Phase 1/2 services
      # are skipped entirely -- otherwise each fresh checkout would regenerate
      # vendor tarballs with new file mtimes, producing different MD5s and
      # needless re-uploads.  Entries are content-addressed so a partial hit
      # via restore-keys is always safe: unused SHA-keyed subdirs are ignored.
      - name: Restore percona-obs cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: percona-obs-${{ runner.os }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            percona-obs-${{ runner.os }}-

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      # Two profiles are needed:
      #
      #   main    — points at the main branch's OBS project; used as the
      #             --branch-from source so percona-obs can read each package's
      #             last-sync SHA and decide aggregate vs. promote.
      #
      #   pr-N    — points at the PR-specific OBS project (rootprj:pr-N);
      #             packages changed in this PR are synced here from source,
      #             unchanged packages get an _aggregate pointing at main.
      #
      # PERCONA_OBS_PACKAGING_BRANCH for the PR profile is set to
      # refs/pull/<N>/head — a GitHub pseudo-ref accessible via git ls-remote
      # for all PRs including forks.  OBS's obs_scm service uses this ref to
      # check out the PR's packaging files when it builds promoted packages.
      - name: Create percona-obs profiles
        run: |
          PR_ROOTPRJ="${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}"

          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "$OBS_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.server_url }}/${{ github.repository }}.git" \
            profile create main

          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "$PR_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:refs/pull/${PR_NUMBER}/head" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.event.pull_request.head.repo.clone_url }}" \
            profile create "pr-${PR_NUMBER}"

      # Detect whether this is a release-only PR (all changed files under
      # root/ are under root/*/releases/).  Release-only PRs skip the package
      # sync steps entirely — releases/ is excluded from sync push traversal
      # so there is nothing to build.
      - name: Detect release-only PR
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'root/**')
          NON_RELEASE=$(echo "$CHANGED" | grep -v '^root/[^/]*/releases/' || true)
          if [ -z "$CHANGED" ] || [ -n "$NON_RELEASE" ]; then
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
          fi

      # Dry run: shows the sync plan (which packages will be promoted vs
      # aggregated) before the real sync starts, making progress visible early.
      # A failure here aborts the workflow before the real sync runs.
      - name: Plan sync (dry run)
        if: steps.detect.outputs.is_release_pr != 'true'
        run: |
          venv/bin/python -u -m percona_obs \
            -P "pr-${PR_NUMBER}" sync push \
            --dry-run \
            --branch-from main \
            --no-scm-validate

      # -u disables Python stdout buffering so progress lines appear
      # immediately even though output is piped through tee.
      # Output is tee'd to a file so the comment step can parse package counts.
      - name: Sync PR to OBS
        id: sync
        if: steps.detect.outputs.is_release_pr != 'true'
        run: |
          venv/bin/python -u -m percona_obs --verbose \
            -P "pr-${PR_NUMBER}" sync push \
            --branch-from main \
            --no-scm-validate \
            | tee /tmp/sync-output.txt

      # If the PR adds release.yaml files, test the release flow by running
      # sync release against the PR's OBS project.  The source project lives
      # in the production namespace (OBS_ROOTPRJ) — not in the PR namespace —
      # so --source-rootprj is used to read its topology from there while the
      # release target is still created under the PR project.
      - name: Test release (if PR adds release.yaml)
        id: release
        if: steps.detect.outputs.is_release_pr == 'true' || steps.sync.outcome == 'success'
        run: |
          RELEASES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'root/*/releases/*/release.yaml')
          if [ -z "$RELEASES" ]; then
            echo "No release commits in this PR"
            exit 0
          fi
          for release_file in $RELEASES; do
            rel_path="${release_file#root/}"
            rel_dir="${rel_path%/release.yaml}"
            rel_project="${rel_dir//\//:}"
            echo "Releasing: $rel_project"
            venv/bin/python -m percona_obs -P "pr-${PR_NUMBER}" \
              sync release --force \
              --source-rootprj "$OBS_ROOTPRJ" \
              "$rel_project"
          done

      # For release-only PRs there are no package builds to poll.  Report the
      # commit status immediately based on the release dry-run outcome so the
      # "OBS Build" check does not stay pending indefinitely.
      - name: Report release PR commit status
        if: steps.detect.outputs.is_release_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            STATE="success"
            DESC="Release dry-run passed"
          else
            STATE="failure"
            DESC="Release dry-run failed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -X POST \
            -f "state=${STATE}" \
            -f "context=OBS Build" \
            -f "description=${DESC}"

      # The full build-status comment is posted by the `build` job (which has
      # the poll details).  This step only fires for the two terminal-in-sync
      # cases: release-only PRs and sync failures.  For successful non-release
      # PRs it is skipped — `build` will post the real comment.
      - name: Post OBS project comment (sync-side)
        if: always() && (steps.detect.outputs.is_release_pr == 'true' || steps.sync.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RELEASE_PR: ${{ steps.detect.outputs.is_release_pr }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          POLL_OUTCOME: ''
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}
        run: python .github/scripts/post_pr_comment.py

      # Upload the sync output so the `build` job can read it for the comment.
      # Only meaningful when the sync step actually ran and succeeded.
      - name: Upload sync output
        if: steps.sync.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sync-output
          path: /tmp/sync-output.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # build: poll OBS for build completion and post the build-status PR
  # comment.  Runs in parallel with `detect-qa-matrix`.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Wait for OBS builds
    needs: sync
    if: needs.sync.outputs.is_release_pr != 'true' && needs.sync.outputs.sync_outcome == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write

    env:
      PR_NUMBER: ${{ github.event.number }}
      OBS_APIURL: ${{ vars.OBS_APIURL }}
      OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
      OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Download sync output
        uses: actions/download-artifact@v4
        with:
          name: sync-output
          path: /tmp

      # Poll OBS until all builds in the PR project reach a terminal state.
      # Fails the job (and PR check) if any build fails, is broken, or is
      # unresolvable.  Posts the "OBS Build" commit status itself.
      - name: Poll OBS build status
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}:pr-${{ github.event.number }}
          OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/poll_obs_builds.py

      # Always runs so the comment is updated even when poll fails.
      - name: Post OBS project comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RELEASE_PR: 'false'
          SYNC_OUTCOME: 'success'
          RELEASE_OUTCOME: ''
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}
        run: python .github/scripts/post_pr_comment.py

  # ──────────────────────────────────────────────────────────────────────────
  # detect-qa-matrix: discover QA-enabled OBS subprojects and post pending
  # commit statuses for each combo.  Runs in parallel with `build` so the
  # PR shows upcoming QA checks while packages are still building.
  # ──────────────────────────────────────────────────────────────────────────
  detect-qa-matrix:
    name: Detect QA matrix
    needs: sync
    if: needs.sync.outputs.is_release_pr != 'true' && needs.sync.outputs.sync_outcome == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    outputs:
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}
          PR_NUMBER: ${{ github.event.number }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      # Iterate every immediate subproject of the PR's OBS root project, call
      # `percona-obs qa show <project> --json` for each, and concatenate the
      # results into a single matrix array (empty for subprojects without a
      # `qa:` block).
      - name: Discover QA matrix from OBS PR subprojects
        id: matrix
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PROJECT: ${{ vars.OBS_PR_ROOTPRJ }}:pr-${{ github.event.number }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          venv/bin/python .github/scripts/list_qa_matrix.py > /tmp/qa-matrix.json
          MATRIX=$(cat /tmp/qa-matrix.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "${MATRIX}" | jq 'length')" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

      # Post a pending commit status for every matrix combo so the PR's
      # check list shows the upcoming QA jobs while OBS is still building.
      # Each entry is updated later by the matching `qa` matrix job.
      - name: Post pending QA commit statuses
        if: steps.matrix.outputs.has_matrix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -r '.[] | .status_context' /tmp/qa-matrix.json \
            | while IFS= read -r ctx; do
                [ -z "$ctx" ] && continue
                gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                  -X POST \
                  -f "state=pending" \
                  -f "context=${ctx}" \
                  -f "description=Waiting for OBS builds to complete"
              done

  # ──────────────────────────────────────────────────────────────────────────
  # qa: trigger and poll Jenkins, once per matrix combo (in parallel).
  # ──────────────────────────────────────────────────────────────────────────
  qa:
    name: ${{ matrix.status_context }}
    needs: [build, detect-qa-matrix]
    if: needs.detect-qa-matrix.outputs.has_matrix == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Required to post the commit status on the PR head commit.
      statuses: write

    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-qa-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      # Same CI profile as the detect job so `qa run` re-resolves project.yaml
      # parameters identically (same OBS_ROOTPRJ → same ${OBS_ROOTPRJ_SLASHES}).
      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}
          PR_NUMBER: ${{ github.event.number }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      - name: Set pending QA status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -X POST \
            -f "state=pending" \
            -f "context=${{ matrix.status_context }}" \
            -f "description=QA running..."

      - name: Run qa pipeline
        id: run
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          venv/bin/python -m percona_obs -P ci qa run "${{ matrix.project }}" \
            --wait \
            --report-json /tmp/qa-report.json \
            ${{ matrix.axis_filters }}

      # Always runs (after the pending status was posted) so the final status
      # is never left as "pending" regardless of which earlier step failed.
      - name: Post QA commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BUILD_URL=""
          BUILD_RESULT=""
          if [ -f /tmp/qa-report.json ]; then
            BUILD_URL=$(jq -r '.combos[0].build_url // ""' /tmp/qa-report.json)
            BUILD_RESULT=$(jq -r '.combos[0].result // ""' /tmp/qa-report.json)
          fi

          RUN_OUTCOME="${{ steps.run.outcome }}"

          if [ "$RUN_OUTCOME" = "success" ] && [ "$BUILD_RESULT" = "SUCCESS" ]; then
            STATE="success"
            DESC="QA passed"
          elif [ -n "$BUILD_RESULT" ]; then
            STATE="failure"
            DESC="QA failed: ${BUILD_RESULT}"
          else
            STATE="failure"
            DESC="QA failed to run"
          fi

          ARGS=(-X POST
            -f "state=${STATE}"
            -f "context=${{ matrix.status_context }}"
            -f "description=${DESC}")
          if [ -n "$BUILD_URL" ]; then
            ARGS+=(-f "target_url=${BUILD_URL}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" "${ARGS[@]}"

  # ──────────────────────────────────────────────────────────────────────────
  # qa-cleanup: when `build` fails, the pending QA statuses posted by
  # `detect-qa-matrix` would otherwise sit as "pending" forever (because
  # `qa` is skipped on build failure).  Flip them to "failure".
  # ──────────────────────────────────────────────────────────────────────────
  qa-cleanup:
    name: QA cleanup (${{ matrix.status_context }})
    needs: [build, detect-qa-matrix]
    # `failure()` opts into running when an upstream `needs` has failed —
    # without it GitHub Actions implicitly adds `success() &&` and the job
    # would be skipped instead of running on a build failure.
    if: ${{ failure() && needs.build.result == 'failure' && needs.detect-qa-matrix.outputs.has_matrix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-qa-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Mark QA as failed (OBS builds failed)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -X POST \
            -f "state=failure" \
            -f "context=${{ matrix.status_context }}" \
            -f "description=Skipped: OBS builds failed"
