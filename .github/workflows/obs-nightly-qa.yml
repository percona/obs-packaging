name: OBS Nightly QA

# Runs nightly (and on demand via workflow_dispatch) against `main`.
# Discovers QA-enabled OBS subprojects beneath ${{ vars.OBS_ROOTPRJ }},
# triggers Jenkins via `percona-obs qa run` for each matrix combo, posts
# a per-combo commit status on the main HEAD, and finally aggregates the
# results into one shields.io endpoint badge per top-level project
# (qa-badge-ppg-17.json, qa-badge-ppg-18.json, ...) on the `badges` branch.

on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC nightly
  workflow_dispatch: {}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # detect: discover QA-enabled subprojects under OBS_ROOTPRJ and emit the
  # GitHub Actions matrix.
  # ──────────────────────────────────────────────────────────────────────────
  detect:
    name: Detect QA matrix
    runs-on: ubuntu-latest

    outputs:
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      head_sha: ${{ steps.sha.outputs.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve main HEAD SHA
        id: sha
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_ROOTPRJ}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      - name: Discover QA matrix
        id: matrix
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PROJECT: ${{ vars.OBS_ROOTPRJ }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          venv/bin/python .github/scripts/list_qa_matrix.py > /tmp/qa-matrix.json
          MATRIX=$(cat /tmp/qa-matrix.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "${MATRIX}" | jq 'length')" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # qa: trigger Jenkins for each matrix combo (in parallel), post a commit
  # status on the main HEAD, upload the per-combo report JSON as artifact.
  # ──────────────────────────────────────────────────────────────────────────
  qa:
    name: ${{ matrix.status_context }}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_matrix == 'true'
    permissions:
      # Required to post the commit status on the main HEAD.
      statuses: write

    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      # Same CI profile as the detect job so `qa run` re-resolves project.yaml
      # parameters identically (same OBS_ROOTPRJ → same ${OBS_CONTAINER_REGISTRY_ROOTPRJ}).
      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_ROOTPRJ}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      - name: Set pending QA status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -X POST \
            -f "state=pending" \
            -f "context=Nightly ${{ matrix.status_context }}" \
            -f "description=QA running..."

      - name: Run qa pipeline
        id: run
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          venv/bin/python -m percona_obs -P ci qa run "${{ matrix.project }}" \
            --wait \
            --report-json /tmp/qa-report.json \
            ${{ matrix.axis_filters }}

      # Always runs (after the pending status was posted) so the final status
      # is never left as "pending" regardless of which earlier step failed.
      - name: Post QA commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          BUILD_URL=""
          BUILD_RESULT=""
          if [ -f /tmp/qa-report.json ]; then
            BUILD_URL=$(jq -r '.combos[0].build_url // ""' /tmp/qa-report.json)
            BUILD_RESULT=$(jq -r '.combos[0].result // ""' /tmp/qa-report.json)
          fi

          RUN_OUTCOME="${{ steps.run.outcome }}"

          if [ "$RUN_OUTCOME" = "success" ] && [ "$BUILD_RESULT" = "SUCCESS" ]; then
            STATE="success"
            DESC="QA passed"
          elif [ -n "$BUILD_RESULT" ]; then
            STATE="failure"
            DESC="QA failed: ${BUILD_RESULT}"
          else
            STATE="failure"
            DESC="QA failed to run"
          fi

          ARGS=(-X POST
            -f "state=${STATE}"
            -f "context=Nightly ${{ matrix.status_context }}"
            -f "description=${DESC}")
          if [ -n "$BUILD_URL" ]; then
            ARGS+=(-f "target_url=${BUILD_URL}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" "${ARGS[@]}"

      # Upload the per-combo report so the aggregate job can build the badge.
      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ strategy.job-index }}
          path: /tmp/qa-report.json
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # aggregate: download every per-combo report, compute one shields.io
  # endpoint badge per top-level project, push them to the orphan `badges`
  # branch (same pattern as sync-main.yml's "Publish OBS build badge").
  # ──────────────────────────────────────────────────────────────────────────
  aggregate:
    name: Aggregate QA badges
    needs: [detect, qa]
    runs-on: ubuntu-latest
    if: always() && needs.detect.outputs.has_matrix == 'true'
    permissions:
      # Required to push qa-badge-*.json to the badges branch.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/qa-reports
          pattern: qa-report-*

      - name: Compute QA badges
        run: |
          mkdir -p /tmp/qa-badges
          python3 .github/scripts/aggregate_qa_badges.py /tmp/qa-reports /tmp/qa-badges
          ls -la /tmp/qa-badges

      - name: Publish QA badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          BADGES=(/tmp/qa-badges/qa-badge-*.json)
          if [ ${#BADGES[@]} -eq 0 ]; then
            echo "no badges to publish"
            exit 0
          fi
          for f in "${BADGES[@]}"; do
            NAME=$(basename "$f")
            BADGE=$(base64 -w0 "$f")
            FILE_SHA=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/$NAME?ref=badges" \
              --jq '.sha' 2>/dev/null || echo "")
            ARGS=(-X PUT
              -f "message=ci: update QA badge ($NAME)"
              -f "content=$BADGE"
              -f "branch=badges")
            if [ -n "$FILE_SHA" ]; then
              ARGS+=(-f "sha=$FILE_SHA")
            fi
            gh api "repos/$GITHUB_REPOSITORY/contents/$NAME" "${ARGS[@]}"
          done
