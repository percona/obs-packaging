name: OBS Nightly QA

# One PostgreSQL major per night (see .github/nightly-qa-schedule.yml):
# at 23:00 UTC Monday to Friday, runs the QA of the major listed for that
# weekday against `main`: its own projects plus the shared-image builds that
# involve it. `percona-obs qa run` triggers Jenkins for each matrix combo
# (each its own GitHub Actions check run on the main HEAD).
#
# A scheduled run is skipped when nothing under root/ changed since the last
# successful run of the same major (a package refresh job runs 4 hours
# earlier, so component changes outside this repo reach OBS before then).
#
# Run it by hand (Actions > OBS Nightly QA > Run workflow) with "major":
# "today" follows the schedule, a number runs that major, "all" runs
# everything (e.g. release testing).

on:
  schedule:
    - cron: '0 2 * * 1-5'    # 02:00 UTC, Monday to Friday
  workflow_dispatch:
    inputs:
      major:
        description: 'PostgreSQL major to test: today (as scheduled), 14-19, or all'
        type: choice
        default: today
        options: [today, '14', '15', '16', '17', '18', '19', all]

# Never cancel a running nightly: a second run waits for the first.
concurrency:
  group: obs-nightly-qa
  cancel-in-progress: false

jobs:
  # plan: tonight's major, and whether anything changed for it since its last
  # successful run (.github/scripts/nightly_plan.py).
  plan:
    name: Plan tonight's QA
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      major: ${{ steps.plan.outputs.major }}
      marker: ${{ steps.plan.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MAJOR: ${{ github.event.inputs.major }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly_plan.py

  detect:
    name: Detect QA matrix
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    permissions:
      packages: read

    outputs:
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_ROOTPRJ}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      - name: Discover QA matrix
        id: matrix
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PROJECT: ${{ vars.OBS_ROOTPRJ }}
          QA_MAJOR: ${{ needs.plan.outputs.major }}
          # Each project runs on the instance that hosts it (as obs-qa-run.yml):
          # one server does not host every project.
          OBS_INSTANCES: ${{ vars.OBS_INSTANCES }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          venv/bin/python .github/scripts/list_qa_matrix.py > /tmp/qa-matrix.json
          {
            echo "matrix<<EOF"
            cat /tmp/qa-matrix.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$(jq 'length' /tmp/qa-matrix.json) Jenkins build(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq 'length' /tmp/qa-matrix.json)" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

      # Marks which major this run tested; the plan job of later nights looks
      # for it on successful runs to decide whether anything changed since.
      - name: Record the tested major
        run: echo "${{ needs.plan.outputs.major }}" > /tmp/nightly-major.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.marker }}
          path: /tmp/nightly-major.txt

  # ──────────────────────────────────────────────────────────────────────────
  # qa: trigger Jenkins for each matrix combo (in parallel) and upload the
  # per-combo report JSON as an artifact for the aggregate job.
  # ──────────────────────────────────────────────────────────────────────────
  qa:
    name: ${{ matrix.status_context }}
    needs: detect
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    if: needs.detect.outputs.has_matrix == 'true'
    permissions:
      packages: read

    # A per-major run takes about 1h20m; 5 hours leaves room for Jenkins queueing
    # while staying under GitHub's 6-hour job limit.
    timeout-minutes: 300
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false
      # At most 20 jobs at once, so the nightly never takes every runner slot.
      max-parallel: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Connect to the instance hosting this combo's project (resolved by the
      # detect job from OBS_INSTANCES), with that instance's credentials.
      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance_apiurl }}
          obs-user: ${{ matrix.instance_user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance_name)] }}

      # The instance's CI profile, as obs-qa-run.yml writes it, so `qa run`
      # resolves project.yaml parameters (registry, root, env) for that instance.
      - name: Write CI profile
        shell: bash
        env:
          OBS_APIURL: ${{ matrix.instance_apiurl }}
          OBS_ROOTPRJ: ${{ matrix.instance_rootprj }}
          OBS_REGISTRY: ${{ matrix.instance_registry }}
          INSTANCE_ENV: ${{ matrix.instance_env }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_ROOTPRJ}
          ${OBS_REGISTRY:+registry: ${OBS_REGISTRY}}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: ''
          EOF
          if [ -n "${INSTANCE_ENV:-}" ] && [ "$INSTANCE_ENV" != "null" ]; then
            jq -r 'to_entries[] | "  - name: \(.key)\n    value: '"'"'\(.value)'"'"'"' \
              <<<"$INSTANCE_ENV" >> .profile/ci.yaml
          fi

      # `name_filter` / `package_filter` / `axis_filters` are tool-generated
      # flag strings from `qa show --json` (normalised by list_qa_matrix.py),
      # same contract as obs-pr-check.yml.  No presence filter here: on the
      # production root every package exists, so every package lane runs.
      - name: Run qa pipeline
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          venv/bin/python -m percona_obs -P ci qa run "${{ matrix.project }}" \
            --pipeline "${{ matrix.pipeline }}" \
            --wait \
            --report-json /tmp/qa-report.json \
            ${{ matrix.name_filter }} \
            ${{ matrix.package_filter }} \
            ${{ matrix.axis_filters }}

      # Upload the per-combo report so the aggregate job can build the badge.
      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ strategy.job-index }}
          path: /tmp/qa-report.json
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # aggregate: download every per-combo report, compute one shields.io
  # endpoint badge per top-level project, push them to the orphan `badges`
  # branch (same pattern as sync-main.yml's "Publish OBS build badge").
  # ──────────────────────────────────────────────────────────────────────────
  aggregate:
    name: Aggregate QA badges
    needs: [detect, qa]
    runs-on: ubuntu-latest
    # Disabled: QA status is now surfaced by an external web dashboard, so we
    # no longer publish qa-badge-*.json to the badges branch nor rewrite the
    # README QA column (the latter pushes directly to main, blocked once main
    # is protected). Re-enable (restore the has_matrix guard) if in-repo QA
    # badges are needed again.
    if: false
    permissions:
      # Required to push qa-badge-*.json to the badges branch.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history + GH_PAT so the README QA-badge update step can
          # rebase and push back to main alongside the badges-branch push.
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/qa-reports
          pattern: qa-report-*

      - name: Compute QA badges
        run: |
          mkdir -p /tmp/qa-badges
          python3 .github/scripts/aggregate_qa_badges.py /tmp/qa-reports /tmp/qa-badges
          ls -la /tmp/qa-badges

      - name: Publish QA badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          BADGES=(/tmp/qa-badges/qa-badge-*.json)
          if [ ${#BADGES[@]} -eq 0 ]; then
            echo "no badges to publish"
            exit 0
          fi
          for f in "${BADGES[@]}"; do
            NAME=$(basename "$f")
            BADGE=$(base64 -w0 "$f")
            FILE_SHA=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/$NAME?ref=badges" \
              --jq '.sha' 2>/dev/null || echo "")
            ARGS=(-X PUT
              -f "message=ci: update QA badge ($NAME)"
              -f "content=$BADGE"
              -f "branch=badges")
            if [ -n "$FILE_SHA" ]; then
              ARGS+=(-f "sha=$FILE_SHA")
            fi
            gh api "repos/$GITHUB_REPOSITORY/contents/$NAME" "${ARGS[@]}"
          done

      # Rewrite the QA Status column in README.md so each top-level
      # distribution row links to its just-published shields.io badge.
      # Idempotent and rebases against main, so it converges with concurrent
      # sync-main pushes.
      - name: Update README QA badges
        run: python3 .github/scripts/update_qa_badges.py /tmp/qa-badges
