name: Sync to OBS (main)

# Runs whenever a push to main touches any file under root/.
# Syncs the full package tree to OBS (releases/ directories are excluded from
# sync push traversal). Release tags are created by obs-pr-cleanup.yml on
# release-PR merge, which then dispatches obs-release.yml directly.
#
# Two-job debounce design: the `sync` job serializes on its own concurrency
# group and is never cancelled mid-upload, so back-to-back pushes queue up
# short sync runs instead of waiting behind a multi-hour build poll.  The
# `poll` job runs in a cancel-superseding group so a newer push's poll
# replaces an older run's poll (the OBS badge and version lists are derived
# from the last *successful* run's SHA, so whichever poll survives covers
# the superseded runs' ranges too).
#
# One sync/poll pair runs per entry of the `OBS_INSTANCES` repository
# variable (a JSON list of objects: name, apiurl, rootprj, pr_rootprj and
# the optional include_repos/exclude_repos/include_projects/exclude_projects
# glob lists that slice the packaging tree for that instance).  Each leg
# authenticates with the secret `OBS_PASSWORD_<NAME>` (NAME being the
# instance's `name`) and keeps its own concurrency group, profile, sync
# report artifact and build badge file, so instances never serialize behind
# or overwrite each other.

on:
  push:
    branches: [main]
    paths:
      - 'root/**'
      - '!root/README.md'
  # Manual escape hatch.  The main use is repairing a package whose local
  # sync-state manifest entry no longer matches OBS (e.g. the package was
  # deleted from OBS and later restored with byte-identical content, so the
  # git tree diff against the recorded SHA is empty and --skip-unchanged
  # skips it).  A forced, scoped sync re-uploads it and refreshes the entry.
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to sync (e.g. ppg:staging:16:tde); empty = whole tree'
        required: false
        default: ''
      package:
        description: 'Package to sync (requires project); empty = all packages'
        required: false
        default: ''
      force:
        description: 'Force re-upload: ignore the skip-unchanged fast paths'
        type: boolean
        required: false
        default: false

jobs:
  sync:
    name: percona-obs sync push (${{ matrix.instance.name }})
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.OBS_INSTANCES) }}
    # Serialize syncs per instance; never cancel a sync mid-upload.
    concurrency:
      group: sync-main-sync-${{ matrix.instance.name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    # Matrix job outputs are last-writer-wins; release_only is computed from
    # the pushed commit range alone, so every leg writes the same value.
    outputs:
      release_only: ${{ steps.detect.outputs.release_only }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: sync push reads git log to detect
          # per-package changes since the last OBS sync commit SHA.
          fetch-depth: 0

      # A push whose root/ changes are entirely under root/*/releases/ carries no
      # packaging change, and must NOT be synced.  PPG_RELEASE is computed from
      # release.yaml, so merging a release PR changes the rendered container tags;
      # syncing here would rebuild those images with the NEXT release counter at
      # the same moment obs-release.yml is copying the current ones out of
      # staging, and the release workflow waits for staging to go quiet before it
      # copies.  The retag lands on the next packaging push instead.
      - name: Detect release-only push
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          # Unknown range (workflow_dispatch, first push, force push, shallow
          # clone): never skip.
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            echo "unknown before-SHA; syncing"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA" -- 'root/**')
          NON_RELEASE=$(echo "$CHANGED" | grep -v '^root/[^/]*/releases/' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_RELEASE" ]; then
            echo "release_only=true" >> "$GITHUB_OUTPUT"
            echo "release-only push; skipping sync"
          else
            echo "release_only=false" >> "$GITHUB_OUTPUT"
          fi

      # Packages synced before the migration to percona/obs-packaging carry
      # OBS sync comments whose SHAs come from the legacy repo's history and
      # do not resolve in this clone, which forces --skip-unchanged off the
      # cheap git gate into services + upload comparison for every such
      # package.  Fetch the legacy history so those SHAs resolve; drop this
      # step once all packages have been re-synced with percona SHAs.
      - name: Fetch legacy repo history (pre-migration sync SHAs)
        run: |
          git fetch https://github.com/rjd15372/percona-obs-packaging.git \
            'refs/heads/*:refs/remotes/legacy/*' \
            || echo "::warning::legacy repo unreachable; sync falls back to content checks"

      # Persists the content-addressed .cache/ tree across runs, split in
      # two entries:
      #
      #   deps — download_url, cargo_vendor and Phase 2 manual-service
      #          outputs (crates, go tarballs, vendor tarballs): small and
      #          stable across commits.  Also carries the sync_state
      #          manifest used by --skip-unchanged.
      #   scm  — Phase 1 obs_scm outputs: multi-GB source archives keyed by
      #          upstream HEAD, churning on every upstream advance.
      #
      # Splitting keeps the small, highly-reusable deps cache from being
      # evicted out of the repo's 10 GB Actions cache quota by churn in the
      # much larger scm tree.  Without any cache, every main sync would
      # regenerate vendor tarballs with new file mtimes and needlessly
      # re-upload them.  Entries are content-addressed so a partial hit via
      # restore-keys is always safe: unused SHA-keyed subdirs are ignored.
      # The deps `path` list MUST stay identical to the one in obs-pr-check.yml:
      # actions/cache hashes the path list into the cache *version*, and
      # restore-keys only match entries with the same version.  A divergence
      # silently hides main's deps cache from PR runs.
      - name: Restore percona-obs deps cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/download_url
            .cache/cargo_vendor
            .cache/services
            .cache/sync_state
          key: percona-obs-deps-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            percona-obs-deps-${{ runner.os }}-

      - name: Restore percona-obs scm cache
        uses: actions/cache@v4
        with:
          path: .cache/obs_scm
          key: percona-obs-scm-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            percona-obs-scm-${{ runner.os }}-

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance.apiurl }}
          obs-user: ${{ matrix.instance.user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance.name)] }}

      # The instance's repo/project filters slice the packaging tree down to
      # what this OBS instance builds; an absent key is an empty string and
      # contributes no flag.
      - name: Create percona-obs profile (${{ matrix.instance.name }})
        shell: bash
        env:
          OBS_APIURL: ${{ matrix.instance.apiurl }}
          INCLUDE_REPOS: ${{ matrix.instance.include_repos }}
          EXCLUDE_REPOS: ${{ matrix.instance.exclude_repos }}
          INCLUDE_PROJECTS: ${{ matrix.instance.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.instance.exclude_projects }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INCLUDE_REPOS:-}" ]; then args+=(--include-repos "$INCLUDE_REPOS"); fi
          if [ -n "${EXCLUDE_REPOS:-}" ]; then args+=(--exclude-repos "$EXCLUDE_REPOS"); fi
          if [ -n "${INCLUDE_PROJECTS:-}" ]; then args+=(--include-projects "$INCLUDE_PROJECTS"); fi
          if [ -n "${EXCLUDE_PROJECTS:-}" ]; then args+=(--exclude-projects "$EXCLUDE_PROJECTS"); fi
          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "${{ matrix.instance.rootprj }}" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.server_url }}/${{ github.repository }}.git" \
            "${args[@]}" \
            profile create main

      # releases/ directories are excluded from sync push traversal (each
      # root/*/releases/<name>/ contains a release.yaml marker that prevents
      # find_projects/find_packages from descending), so release commits are
      # synced normally but produce no OBS changes.
      # The report JSON scopes the poll job to the packages this run touched;
      # remove any stale report first (self-hosted runners reuse /tmp).
      #
      # A manual run may scope the sync to one project/package and/or pass
      # --force, which bypasses the manifest and OBS-comment skip decisions
      # so the package is re-uploaded (MD5 comparison still suppresses
      # unchanged files at upload time).
      - name: Sync to OBS
        if: steps.detect.outputs.release_only != 'true'
        env:
          SYNC_PROJECT: ${{ inputs.project }}
          SYNC_PACKAGE: ${{ inputs.package }}
          SYNC_FORCE: ${{ inputs.force }}
        # Explicit, like the detect step above: this job's default shell in the
        # obs-tools container is `sh -e {0}` (dash), where the array below is a
        # syntax error.
        shell: bash
        run: |
          rm -f /tmp/sync-report.json
          if [ -n "$SYNC_PACKAGE" ] && [ -z "$SYNC_PROJECT" ]; then
            echo "::error::'package' input requires 'project'"
            exit 1
          fi
          # if/then, not `[ ... ] && ...`: a false test as the last command of
          # an AND list exits non-zero, which `-e` turns into a step failure on
          # every push run (all inputs empty).
          args=()
          if [ "$SYNC_FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$SYNC_PROJECT" ]; then args+=("$SYNC_PROJECT"); fi
          if [ -n "$SYNC_PACKAGE" ]; then args+=("$SYNC_PACKAGE"); fi
          venv/bin/python -m percona_obs --verbose -P main sync push \
            --no-scm-validate --skip-unchanged --report-json /tmp/sync-report.json \
            "${args[@]}"

      # Drop cache entries not used by any run in the last 7 days so the
      # .cache/ tree saved by actions/cache stops growing monotonically.
      # Entry mtimes are bumped on every cache hit, so age == unused-for.
      # Runs even when the sync fails: pruning only removes stale entries.
      - name: Prune stale cache entries
        if: always() && steps.detect.outputs.release_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/prune_obs_cache.py

      # Hand the report to the poll job.  Only uploaded on success: poll
      # only runs after a successful sync, so an always() upload is not
      # needed.
      - name: Upload sync report
        if: steps.detect.outputs.release_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ matrix.instance.name }}
          path: /tmp/sync-report.json
          retention-days: 1

  poll:
    name: Wait for OBS builds (${{ matrix.instance.name }})
    needs: sync
    if: needs.sync.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.OBS_INSTANCES) }}
    # Newest poll wins, per instance: a newer push's poll supersedes
    # (cancels) older polls of the same instance only.
    concurrency:
      group: sync-main-poll-${{ matrix.instance.name }}
      cancel-in-progress: true
    permissions:
      # Required to push the badge JSON to the badges branch.
      contents: write
      # Required to query sibling workflow runs (gh api .../actions/...).
      actions: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to git-diff release.yaml files against
          # the last-successful base SHA.
          fetch-depth: 0

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance.apiurl }}
          obs-user: ${{ matrix.instance.user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance.name)] }}

      - name: Download sync report
        uses: actions/download-artifact@v4
        with:
          name: sync-report-${{ matrix.instance.name }}
          path: /tmp

      # A superseded (cancelled) poll never runs the version-lists step
      # below, so the surviving run must cover the cancelled runs' ranges
      # too.  Diffing from the head SHA of the last SUCCESSFUL sync-main run
      # does exactly that.  Fall back to github.event.before (empty for
      # workflow_dispatch), then to the all-zeros SHA.
      - name: Compute last-successful base SHA
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_GOOD=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/sync-main.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          BASE="${LAST_GOOD:-${{ github.event.before }}}"
          BASE="${BASE:-0000000000000000000000000000000000000000}"
          echo "sha=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Diff base: ${BASE}"

      # Poll OBS until all builds reach a terminal state.  Fails the job if
      # any build fails, is broken, or is unresolvable.  The sync report
      # scopes polling to the packages the sync job actually touched.
      - name: Poll OBS build status
        id: poll
        env:
          OBS_APIURL: ${{ matrix.instance.apiurl }}
          OBS_ROOTPRJ: ${{ matrix.instance.rootprj }}
          OBS_REPO_FILTER: ${{ toJSON(matrix.instance) }}
          OBS_SYNC_REPORT: /tmp/sync-report.json
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/poll_obs_builds.py

      # Update docs/versions/<dist>.md for each distribution project touched
      # since the last successful run, and refresh the README "## Development
      # Projects" section.  Only runs when OBS builds all succeed.
      # Disabled: this step git-pushes regenerated docs/versions/*.md and
      # README.md directly to main, which is blocked once main is protected
      # against direct pushes. Re-enable (restore the poll-outcome guard) once
      # a PR-based or badges-branch publishing path is in place.
      - name: Update version lists
        if: false
        env:
          GITHUB_EVENT_BEFORE: ${{ steps.base.outputs.sha }}
          OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
          OBS_ROOTPRJ: ${{ matrix.instance.rootprj }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/update_version_lists.py

      # Push the badge JSON to the orphan `badges` branch so it can be
      # embedded in README.md via a shields.io endpoint badge.
      # Runs even when the poll step fails so the badge always reflects the
      # latest build outcome.
      # One badge file per instance (README embeds the b.o.o one), so the
      # legs never overwrite each other's badge.
      - name: Publish OBS build badge
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_FILE: obs-build-badge-${{ matrix.instance.name }}.json
        run: |
          [ -f /tmp/obs-build-badge.json ] || exit 0
          BADGE=$(base64 -w0 /tmp/obs-build-badge.json)
          FILE_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/${BADGE_FILE}?ref=badges" \
            --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/${BADGE_FILE}" \
              -X PUT \
              -f message="ci: update OBS build badge" \
              -f content="$BADGE" \
              -f branch=badges \
              -f sha="$FILE_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/contents/${BADGE_FILE}" \
              -X PUT \
              -f message="ci: update OBS build badge" \
              -f content="$BADGE" \
              -f branch=badges
          fi
