name: OBS Release

# Triggered when a release tag is pushed (e.g. ppg/17.9).
# The tag is created automatically by obs-pr-cleanup.yml when a PR that adds
# a release.yaml file is merged.
# Runs `sync release` to transfer binaries from the source OBS project to
# the release target project, then updates the version list documentation.

on:
  push:
    tags: ['*/*']

jobs:
  release:
    name: Release packages in OBS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    env:
      OBS_APIURL: ${{ vars.OBS_APIURL }}
      OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Create percona-obs profile
        run: |
          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "$OBS_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.server_url }}/${{ github.repository }}.git" \
            profile create main

      # Derive the release project from the tag name.
      # Tag ppg/17.9 → release project ppg:releases:17.9
      - name: Derive release project
        id: release-info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PRODUCT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          RELEASE_PROJECT="${PRODUCT}:releases:${VERSION}"
          echo "release_project=$RELEASE_PROJECT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release to OBS
        run: |
          venv/bin/python -m percona_obs -P main \
            sync release "${{ steps.release-info.outputs.release_project }}"

      # Poll OBS until all builds reach a terminal state (succeeded, failed,
      # disabled, excluded).  For a release project most repos have builds
      # disabled so they resolve immediately; only the containers subproject
      # actually schedules builds.
      - name: Poll OBS build status
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/poll_obs_builds.py

      # Update docs/versions/<dist>.md for all distribution projects and
      # refresh the README "## Version Lists" section.  GITHUB_EVENT_BEFORE is
      # omitted so the script regenerates all version lists (appropriate for a
      # tag-triggered run where there is no meaningful "before" SHA).
      # Only runs when OBS builds all succeed.
      - name: Update version lists
        if: steps.poll.outcome == 'success'
        env:
          OBS_WEB_URL: ${{ vars.OBS_WEB_URL }}
          OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}
          PYTHONPATH: ${{ github.workspace }}
        run: venv/bin/python .github/scripts/update_version_lists.py
