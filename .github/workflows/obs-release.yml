name: OBS Release

# Dispatched by obs-pr-cleanup.yml when a release PR merges (the tag is
# created there, on the merge commit, then this workflow is dispatched with
# it).  workflow_dispatch is the ONLY trigger: tags pushed to the repo are
# deliberately inert (no PAT exists, and human-pushed tags must not start
# releases by accident).  Manual recovery:
#   gh workflow run obs-release.yml -f tag=ppg/17.11-1
#
# Pending-cancellation race: this job shares the "sync-main-sync"
# concurrency group (cancel-in-progress: false) with sync-main's sync job.
# GitHub only keeps ONE pending run per group, so if a root/** push queues
# another sync-main sync job while this dispatched run is still pending
# behind an in-progress one, this run is CANCELLED rather than queued
# again. Symptom: the dispatched "OBS Release" run shows as cancelled with
# no release having happened. Recovery: re-dispatch with the manual command
# above once the concurrency group is free.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ppg/17.11-1)"
        required: true

jobs:
  release:
    name: Release packages in OBS
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    # Never run concurrently with a sync-main source upload: the release
    # freezes staging builds and must see a stable source state.
    concurrency:
      group: sync-main-sync
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read

    env:
      OBS_APIURL: ${{ vars.OBS_APIURL }}
      OBS_ROOTPRJ: ${{ vars.OBS_ROOTPRJ }}

    steps:
      - name: Validate tag input
        run: |
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^[a-z0-9-]+/[0-9]+(\.[0-9]+)+-[0-9]+$'; then
            echo "::error::tag '$TAG' does not match <product>/<major.minor-N>"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      - name: Create percona-obs profile
        run: |
          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "$OBS_ROOTPRJ" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:main" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.server_url }}/${{ github.repository }}.git" \
            profile create main

      # Derive the release project from the tag name.
      # Tag ppg/17.9-1 → product=ppg, version=17.9-1, major=17
      # → release project ppg:releases:17
      - name: Derive release project
        id: release-info
        run: |
          TAG="${{ inputs.tag }}"
          PRODUCT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          MAJOR_VERSION="${VERSION%%.*}"
          RELEASE_PROJECT="${PRODUCT}:releases:${MAJOR_VERSION}"
          RELEASE_ID="${VERSION}"
          echo "release_project=$RELEASE_PROJECT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "major_version=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Release to OBS
        run: |
          venv/bin/python -m percona_obs -P main \
            sync release "${{ steps.release-info.outputs.release_project }}"

      # Create a GitHub release with the CHANGELOG section for this release-id.
      # Idempotent: if the release already exists (re-run), update its notes.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release-info.outputs.tag }}"
          RELEASE_ID="${{ steps.release-info.outputs.release_id }}"
          CHANGELOG="root/${{ steps.release-info.outputs.product }}/releases/${{ steps.release-info.outputs.major_version }}/CHANGELOG.md"
          BODY=$(venv/bin/python3 -c \
            "import re,sys; content=open(sys.argv[2]).read(); m=re.search(r'(## \['+re.escape(sys.argv[1])+r'\].*?)(?=\n## \[|\Z)',content,re.DOTALL); print(m.group(1).strip() if m else '')" \
            "$RELEASE_ID" "$CHANGELOG" 2>/dev/null || true)
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "${BODY:-No changelog available.}" \
          || gh release edit "$TAG" \
            --notes "${BODY:-No changelog available.}"
