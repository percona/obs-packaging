name: OBS PR Cleanup

# When a PR is closed:
#   - merged release PR (all changed root/** files under root/*/releases/):
#     create the release tag on the merge commit and dispatch obs-release.yml
#     with the tags it created in this run (workflow_dispatch works with GITHUB_TOKEN; a tag push would
#     not trigger anything — GitHub suppresses workflow-to-workflow triggers
#     for the default token, and this repo has no PAT).
#   - every PR: delete the PR-specific OBS project created by
#     obs-pr-check.yml (no-op if it never existed) and the PR's Actions caches.
#     A merged release PR's project tree is kept: it is the pre-release that
#     obs-release.yml copies from, and obs-release.yml deletes it after a
#     successful final copy.
#
# Two jobs: `release-dispatch` runs once per PR (release detection, tagging
# and ONE obs-release dispatch per PR with pr_number + all tags -- no lock: the
# released binaries sit in the pre-release, not in staging -- and cache
# deletion), while
# `delete` runs once per entry of the `OBS_INSTANCES` repository variable —
# every instance holds its own PR project under its own pr_rootprj and
# authenticates with its own secret `OBS_PASSWORD_<NAME>`.

on:
  pull_request:
    branches: [main]
    paths: ['root/**']
    types: [closed]

jobs:
  release-dispatch:
    name: Tag release and dispatch obs-release
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    outputs:
      is_release_pr: ${{ steps.detect.outputs.is_release_pr }}
    permissions:
      # Required to create release tags on the merge commit.
      contents: write
      # Required to dispatch obs-release.yml and delete the PR's Actions caches.
      actions: write
      packages: read

    env:
      PR_NUMBER: ${{ github.event.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This job never talks to OBS; it needs only the venv this action links.
      # The action requires credentials, so the first instance's are passed.
      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ fromJSON(vars.OBS_INSTANCES)[0].apiurl }}
          obs-user: ${{ fromJSON(vars.OBS_INSTANCES)[0].user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', fromJSON(vars.OBS_INSTANCES)[0].name)] }}

      # Detect whether this is a release-only PR (all changed root/** files are
      # under root/*/releases/).  This output gates tag creation below.  A
      # release-only PR never created a PR OBS project, so the `delete` job
      # below runs as a no-op for it.
      - name: Detect release-only PR
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALL_ROOT=$(gh pr view "$PR_NUMBER" \
            --json files \
            --jq '[.files[] | select(.path | startswith("root/")) | .path] | length')
          REL_ROOT=$(gh pr view "$PR_NUMBER" \
            --json files \
            --jq '[.files[] | select(.path | test("^root/[^/]+/releases/")) | .path] | length')
          if [ "$ALL_ROOT" -gt 0 ] && [ "$ALL_ROOT" -eq "$REL_ROOT" ]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
          fi

      # Merged release PR: tag the merge commit (the exact reviewed snapshot)
      # and dispatch the release workflow with the tags created HERE.  A tag
      # that already exists was not created by this run (e.g. a revert PR that
      # leaves the previous real entry last) and is not dispatched.
      # Tag-creation errors other than "already exists" fail the job loudly —
      # a silently missing tag is how releases used to vanish.
      - name: Tag release and dispatch obs-release
        if: github.event.pull_request.merged == true && steps.detect.outputs.is_release_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        # Container-job steps default to plain `sh`, which rejects
        # `set -o pipefail` and `<<<` here-strings; this script is bash.
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(gh pr view "$PR_NUMBER" --json files \
            --jq '.files[].path | select(test("^root/[^/]+/releases/[^/]+/release\\.yaml$"))' | sort -u)
          [ -z "$FILES" ] && { echo "No release.yaml changed; nothing to tag."; exit 0; }
          TAGS=""
          while IFS= read -r release_file; do
            TAG=$(git show "${MERGE_SHA}:${release_file}" | venv/bin/python3 -c \
              "import sys,yaml; d=yaml.safe_load(sys.stdin); r=d.get('releases') or []; last=r[-1] if r else d.get('revision') or ''; print(last.get('tag','') if isinstance(last, dict) else last)")
            [ -z "$TAG" ] && continue
            echo "Creating tag ${TAG} at ${MERGE_SHA}"
            if ! OUT=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
                -f "ref=refs/tags/${TAG}" -f "sha=${MERGE_SHA}" 2>&1); then
              if echo "$OUT" | grep -q "Reference already exists"; then
                echo "Tag ${TAG} already exists — not created here, not dispatched"
                continue
              else
                echo "::error::Failed to create tag ${TAG}: ${OUT}"
                exit 1
              fi
            fi
            TAGS="${TAGS:+$TAGS }${TAG}"
          done <<< "$FILES"
          [ -z "$TAGS" ] && { echo "No new tag created; nothing to dispatch."; exit 0; }
          echo "Dispatching obs-release.yml with pr_number=${PR_NUMBER} tags=${TAGS}"
          if ! gh workflow run obs-release.yml --ref main -f "pr_number=${PR_NUMBER}" -f "tags=${TAGS}"; then
            echo "::error::Failed to dispatch obs-release.yml. Run manually: gh workflow run obs-release.yml -f pr_number=${PR_NUMBER} -f tags=\"${TAGS}\""
            exit 1
          fi

      # Delete this PR's Actions caches (created by obs-pr-check.yml on the
      # refs/pull/N/merge ref).  Caches on PR merge refs can never be
      # restored by main-branch runs, so leaving them around only churns the
      # repo's 10 GB cache quota and evicts the main branch's caches.
      - name: Delete PR Actions caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/pull/${PR_NUMBER}/merge" \
            --jq '.actions_caches[].id' |
          while read -r cache_id; do
            echo "Deleting Actions cache id ${cache_id}"
            gh api -X DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}" || true
          done

  # One leg per OBS instance: each holds its own PR project and credentials.
  # Runs after release-dispatch (for is_release_pr) but with always(): a failed
  # tag or dispatch must not leave PR projects behind.
  #
  # A merged release PR's project tree is the pre-release obs-release.yml copies
  # from; obs-release.yml deletes it after a successful final copy. Closed-
  # unmerged release PRs are cleaned here like any PR.
  delete:
    name: Delete PR OBS project (${{ matrix.instance.name }})
    needs: [release-dispatch]
    if: ${{ always() && !(github.event.pull_request.merged == true && needs.release-dispatch.outputs.is_release_pr == 'true') }}
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/obs-tools:latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.OBS_INSTANCES) }}
    permissions:
      packages: read

    env:
      PR_NUMBER: ${{ github.event.number }}
      OBS_APIURL: ${{ matrix.instance.apiurl }}
      OBS_PR_ROOTPRJ: ${{ matrix.instance.pr_rootprj }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ matrix.instance.apiurl }}
          obs-user: ${{ matrix.instance.user || vars.OBS_USER }}
          obs-password: ${{ secrets[format('OBS_PASSWORD_{0}', matrix.instance.name)] }}

      # Create the pr-N profile so the delete step can use -P "pr-N" instead
      # of repeating -A and -R.
      - name: Create percona-obs profile
        shell: bash
        env:
          INSTANCE_ENV: ${{ toJSON(matrix.instance.env) }}
        run: |
          # Per-instance env from the OBS_INSTANCES entry, appended after the
          # defaults above so an instance can override them (parse_env_overrides
          # is last-wins, and splits KEY:VALUE on the first colon so a value
          # such as "openSUSE.org:" survives intact).
          env_args=()
          if [ -n "${INSTANCE_ENV:-}" ] && [ "$INSTANCE_ENV" != "null" ]; then
            while IFS= read -r kv; do
              # `if`, not `[ … ] &&`: with an empty env object the test fails on
              # the last line and, as the loop body's final command, would make
              # the loop exit non-zero and trip `set -e`.
              if [ -n "$kv" ]; then env_args+=(-e "$kv"); fi
            done <<<"$(jq -r 'to_entries[] | "\(.key):\(.value)"' <<<"$INSTANCE_ENV")"
          fi
          venv/bin/python -m percona_obs \
            -A "$OBS_APIURL" \
            -R "${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}" \
            -e "REMOTE_OBS_ORG_INTERCONNECT:" \
            -e "PERCONA_OBS_PACKAGING_BRANCH:refs/pull/${PR_NUMBER}/head" \
            -e "PERCONA_OBS_PACKAGING_REPO:${{ github.event.pull_request.head.repo.clone_url }}" \
            "${env_args[@]}" \
            profile create "pr-${PR_NUMBER}"

      # Delete the PR's root project and all its sub-projects.
      # --yes skips the confirmation prompt.
      # --recursive ensures OBS deletes projects that still contain packages
      # (e.g. if a build was in progress when the PR was closed).
      # 404 responses are handled gracefully by percona-obs (no error).
      - name: Delete PR OBS project
        run: |
          venv/bin/python -m percona_obs --verbose \
            -P "pr-${PR_NUMBER}" \
            sync delete \
            --yes \
            --recursive \
            --from-obs
