name: Python Tests

# Runs the percona-obs tool's own checks (black, pyright, pytest) on PRs
# that touch the Python package, its tests or its tooling config.  These
# are pure unit tests: no OBS instance, no secrets and no obs-tools
# container, so the job also runs on PRs opened from forks.
#
# The venv is created the same way CLAUDE.md prescribes for local work so
# pyrightconfig.json (which points at venv/) needs no CI-specific override.

on:
  pull_request:
    branches: [main]
    paths:
      - 'percona_obs/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyrightconfig.json'
      - '.github/workflows/python-tests.yml'

concurrency:
  group: python-tests-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create venv and install dependencies
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: black
        run: venv/bin/black --check percona_obs/ tests/

      - name: pyright
        run: venv/bin/pyright

      - name: pytest
        run: venv/bin/python -m pytest tests -q
