name: OBS PR QA

# Triggered after OBS PR Check succeeds.  Discovers the QA matrix from each
# project.yaml `qa:` block in the PR's OBS subprojects, then runs Jenkins
# pipelines via `percona-obs qa run` and reports one commit status per matrix
# combo on the PR head.
#
# The workflow is a no-op (no status posted) when the PR project has no
# QA-enabled subprojects (i.e. no project.yaml under root/ has a `qa:` block
# whose project was created in the PR's OBS root project).
#
# Re-running failed jobs from the PR UI (Checks tab → "Re-run failed jobs")
# works out of the box: each matrix combo is its own GitHub job, and GitHub
# reuses the detect job's matrix output across attempts.

on:
  workflow_run:
    workflows: ["OBS PR Check"]
    types: [completed]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # detect: resolve the PR context, discover QA-enabled OBS subprojects,
  # and emit the GitHub Actions matrix from their project.yaml `qa:` blocks.
  # ──────────────────────────────────────────────────────────────────────────
  detect:
    name: Detect QA matrix
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    outputs:
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      # Derive the PR number and head SHA from the workflow_run event.
      # pull_requests[0].number is available for same-repo PRs; for forks it
      # is empty so we fall back to searching the GitHub API by head SHA.
      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number" | head -1)
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "Could not resolve PR number for commit ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      # Iterate every immediate subproject of the PR's OBS root project, call
      # `percona-obs qa show <project> --json` for each, and concatenate the
      # results into a single matrix array (empty for subprojects without a
      # `qa:` block).
      - name: Discover QA matrix from OBS PR subprojects
        id: matrix
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PROJECT: ${{ vars.OBS_PR_ROOTPRJ }}:pr-${{ steps.pr.outputs.pr_number }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          venv/bin/python .github/scripts/list_qa_matrix.py > /tmp/qa-matrix.json
          MATRIX=$(cat /tmp/qa-matrix.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "${MATRIX}" | jq 'length')" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # qa: trigger and poll Jenkins, once per matrix combo (in parallel).
  # ──────────────────────────────────────────────────────────────────────────
  qa:
    name: ${{ matrix.status_context }}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_matrix == 'true'
    permissions:
      # Required to post the commit status on the PR head commit.
      statuses: write

    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/obs-setup
        with:
          obs-apiurl: ${{ vars.OBS_APIURL }}
          obs-user: ${{ vars.OBS_USER }}
          obs-password: ${{ secrets.OBS_PASSWORD }}

      # Same CI profile as the detect job so `qa run` re-resolves project.yaml
      # parameters identically (same OBS_ROOTPRJ → same ${OBS_CONTAINER_REGISTRY_ROOTPRJ}).
      - name: Write CI profile
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL }}
          OBS_PR_ROOTPRJ: ${{ vars.OBS_PR_ROOTPRJ }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
        run: |
          mkdir -p .profile
          cat > .profile/ci.yaml <<EOF
          apiurl: ${OBS_APIURL}
          rootprj: ${OBS_PR_ROOTPRJ}:pr-${PR_NUMBER}
          jenkins:
            url: ${JENKINS_URL}
            user: ${JENKINS_USER}
          env:
            - name: REMOTE_OBS_ORG_INTERCONNECT
              value: 'openSUSE.org:'
          EOF

      - name: Set pending QA status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -X POST \
            -f "state=pending" \
            -f "context=${{ matrix.status_context }}" \
            -f "description=QA running..."

      - name: Run qa pipeline
        id: run
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          venv/bin/python -m percona_obs -P ci qa run "${{ matrix.project }}" \
            --wait \
            --report-json /tmp/qa-report.json \
            ${{ matrix.axis_filters }}

      # Always runs (after the pending status was posted) so the final status
      # is never left as "pending" regardless of which earlier step failed.
      - name: Post QA commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          BUILD_URL=""
          BUILD_RESULT=""
          if [ -f /tmp/qa-report.json ]; then
            BUILD_URL=$(jq -r '.combos[0].build_url // ""' /tmp/qa-report.json)
            BUILD_RESULT=$(jq -r '.combos[0].result // ""' /tmp/qa-report.json)
          fi

          RUN_OUTCOME="${{ steps.run.outcome }}"

          if [ "$RUN_OUTCOME" = "success" ] && [ "$BUILD_RESULT" = "SUCCESS" ]; then
            STATE="success"
            DESC="QA passed"
          elif [ -n "$BUILD_RESULT" ]; then
            STATE="failure"
            DESC="QA failed: ${BUILD_RESULT}"
          else
            STATE="failure"
            DESC="QA failed to run"
          fi

          ARGS=(-X POST
            -f "state=${STATE}"
            -f "context=${{ matrix.status_context }}"
            -f "description=${DESC}")
          if [ -n "$BUILD_URL" ]; then
            ARGS+=(-f "target_url=${BUILD_URL}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" "${ARGS[@]}"
